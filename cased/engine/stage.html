/* --- apporbit: modules in orbit around the mark ------------------------ */
BUILD.apporbit = (d) => {
  const n = el('div', 'layer');
  const head = appHead(d);
  if (head) n.appendChild(head);

  const stage = el('div');
  stage.style.cssText = `position:absolute;inset:0;`;
  n.appendChild(stage);

  const cx = 50, cy = 56;
  const mark = el('div');
  const markSize = S.vertical ? 140 : 180;
  mark.style.cssText =
    `position:absolute;left:${cx}%;top:${cy}%;width:${px(markSize)};height:${px(markSize)};` +
    `margin-left:${px(-markSize / 2)};margin-top:${px(-markSize / 2)};border-radius:50%;` +
    `background:var(--accent);display:flex;align-items:center;justify-content:center;`;
  const markText = el('div', 'mono', esc((d.mark || '').slice(0, 2).toUpperCase()));
  markText.style.cssText = `font-size:${px(44)};font-weight:700;color:#fff;letter-spacing:-.02em;`;
  mark.appendChild(markText);
  stage.appendChild(mark);

  // Two rings, so eight modules do not crowd one circle.
  const items = (d.items || []).slice(0, 8);
  const rings = [
    { r: S.vertical ? 21 : 19, n: Math.min(items.length, 4) },
    { r: S.vertical ? 33 : 30, n: Math.max(0, items.length - 4) },
  ];
  for (const ring of rings) {
    if (!ring.n) continue;
    const o = el('div');
    const d2 = ring.r * 2;
    o.style.cssText =
      `position:absolute;left:${cx}%;top:${cy}%;width:${d2}%;padding-bottom:${d2}%;` +
      `height:0;transform:translate(-50%,-50%);border-radius:50%;` +
      `border:1px solid var(--line);opacity:.5;`;
    stage.appendChild(o);
  }

  const pills = items.map((it, i) => {
    const ringIdx = i < 4 ? 0 : 1;
    const within = ringIdx === 0 ? i : i - 4;
    const count = rings[ringIdx].n;
    const ang = (within / Math.max(count, 1)) * Math.PI * 2 - Math.PI / 2 + (ringIdx ? 0.4 : 0);
    const rr = rings[ringIdx].r;
    const x = cx + Math.cos(ang) * rr * (S.vertical ? 1 : 1.22);
    const y = cy + Math.sin(ang) * rr;
    const name = typeof it === 'string' ? it : it.name;
    const p = el('div');
    p.style.cssText =
      `position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%);` +
      `display:flex;align-items:center;gap:${px(12)};white-space:nowrap;` +
      `padding:${px(16)} ${px(32)} ${px(16)} ${px(16)};border-radius:999px;` +
      `background:${S.light ? '#FFFFFF' : 'rgba(20,21,30,.96)'};` +
      `border:1px solid ${S.light ? 'rgba(0,0,0,.08)' : 'var(--line)'};` +
      `box-shadow:0 ${px(14)} ${px(34)} ${S.light ? 'rgba(80,60,40,.14)' : 'rgba(0,0,0,.5)'};`;
    const ic = el('u');
    ic.style.cssText =
      `width:${px(46)};height:${px(46)};border-radius:${px(13)};display:block;` +
      `background:var(--accent);opacity:.2;`;
    const tx = el('span', '', esc(name));
    tx.style.cssText = `font-size:${px(36)};font-weight:600;letter-spacing:-.015em;`;
    p.append(ic, tx);
    stage.appendChild(p);
    return p;
  });

  return {
    node: n,
    update(lt) {
      if (head) head.style.opacity = seg(lt, 0, .4).toFixed(3);
      const m = seg(lt, 0.05, 0.5, E.expo);
      mark.style.opacity = m.toFixed(3);
      mark.style.transform = `scale(${lerp(0.6, 1, m).toFixed(3)})`;
      pills.forEach((p, i) => {
        const q = seg(lt, 0.2 + i * 0.06, 0.2 + i * 0.06 + 0.42, E.expo);
        p.style.opacity = q.toFixed(3);
        p.style.transform = `translate(-50%,-50%) scale(${lerp(0.82, 1, q).toFixed(3)})`;
      });
    },
  };
};

/* --- appwindows: the mess this replaces -------------------------------- */
BUILD.appwindows = (d) => {
  const n = el('div', 'layer');
  const stage = el('div');
  stage.style.cssText = `position:absolute;inset:0;overflow:hidden;`;
  n.appendChild(stage);

  // Deterministic scatter: same seed, same arrangement.
  const r = rng(d.seed || 7);
  const count = Math.min(d.count || 10, 14);
  const cards = [];
  for (let i = 0; i < count; i++) {
    const w = 30 + r() * 20;
    const c = el('div');
    c.style.cssText =
      `position:absolute;left:${(2 + r() * 72).toFixed(1)}%;top:${(2 + r() * 76).toFixed(1)}%;` +
      `width:${w.toFixed(1)}%;border-radius:${px(10)};overflow:hidden;` +
      `background:${S.light ? '#FFFFFF' : 'rgba(20,21,30,.95)'};` +
      `border:1px solid ${S.light ? 'rgba(0,0,0,.14)' : 'var(--line)'};` +
      `box-shadow:0 ${px(18)} ${px(44)} ${S.light ? 'rgba(70,50,30,.26)' : 'rgba(0,0,0,.55)'};` +
      `transform:rotate(${(r() * 10 - 5).toFixed(1)}deg);`;
    const bar = el('div');
    bar.style.cssText =
      `height:${px(30)};background:${sunk(0.6)};display:flex;align-items:center;` +
      `gap:${px(5)};padding:0 ${px(9)};`;
    for (let k = 0; k < 3; k++) {
      const u = el('u');
      u.style.cssText =
        `width:${px(6)};height:${px(6)};border-radius:50%;display:block;` +
        `background:${S.light ? 'rgba(0,0,0,.18)' : 'rgba(255,255,255,.22)'};`;
      bar.appendChild(u);
    }
    c.appendChild(bar);
    const bodyEl = el('div');
    bodyEl.style.cssText = `padding:${px(12)};display:grid;gap:${px(7)};`;
    for (let k = 0; k < 3 + Math.floor(r() * 3); k++) {
      const line = el('u');
      line.style.cssText =
        `display:block;height:${px(6)};border-radius:${px(3)};` +
        `width:${(32 + r() * 60).toFixed(0)}%;` +
        `background:${S.light ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.12)'};`;
      bodyEl.appendChild(line);
    }
    c.appendChild(bodyEl);
    stage.appendChild(c);
    cards.push({ c, delay: r() });
  }

  const cap = el('div', 'display');
  cap.style.cssText =
    `position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;` +
    `padding:${px(26)} ${px(40)};` +
    `background:${S.light ? 'rgba(242,237,228,.92)' : 'rgba(6,7,12,.84)'};` +
    `border-radius:${px(18)};` +
    `--s:${px(S.vertical ? 76 : 108)};text-align:center;line-height:1.02;` +
    `letter-spacing:-.025em;width:86%;`;
  const parts = String(d.text || '').split(/(\*[^*]+\*)/);
  for (const part of parts) {
    if (!part) continue;
    const em = part.startsWith('*') && part.endsWith('*');
    const span = el('span', '', esc(em ? part.slice(1, -1) : part));
    if (em) span.style.cssText = `color:var(--accent);font-style:italic;`;
    cap.appendChild(span);
  }
  n.appendChild(cap);

  return {
    node: n,
    update(lt) {
      cards.forEach(({ c, delay }, i) => {
        const q = seg(lt, 0.02 + delay * 0.3, 0.02 + delay * 0.3 + 0.4, E.expo);
        c.style.opacity = (q * (S.light ? 0.92 : 0.88)).toFixed(3);
        c.style.transform =
          c.style.transform.replace(/ scale\([^)]*\)/, '') + ` scale(${lerp(0.9, 1, q).toFixed(3)})`;
      });
      const p = seg(lt, 0.32, 0.8, E.expo);
      cap.style.opacity = p.toFixed(3);
      cap.style.transform = `translate(-50%,-50%) scale(${lerp(0.96, 1, p).toFixed(4)})`;
    },
  };
};

/* --- appsplit: two audiences, one frame -------------------------------- */
BUILD.appsplit = (d) => {
  const n = el('div', 'layer');
  const halves = [d.left || {}, d.right || {}].map((side, idx) => {
    const h = el('div');
    const dark = idx === 1;
    h.style.cssText =
      `position:absolute;top:0;bottom:0;${idx ? 'right' : 'left'}:0;width:50%;` +
      `padding:${px(S.vertical ? 60 : 92)};display:flex;flex-direction:column;` +
      `justify-content:center;gap:${px(18)};` +
      `background:${dark ? (S.light ? '#13110F' : 'rgba(0,0,0,.55)') : (S.light ? 'transparent' : 'rgba(255,255,255,.03)')};` +
      `color:${dark && S.light ? '#F6F1E8' : 'inherit'};` +
      `border-${idx ? 'left' : 'right'}:1px solid ${S.light ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.14)'};`;
    const k = el('div', 'mono', esc(side.kicker || ''));
    k.style.cssText =
      `font-size:${px(15)};letter-spacing:.14em;text-transform:uppercase;color:var(--accent);`;
    h.appendChild(k);
    const t = el('div', 'display');
    t.style.cssText = `--s:${px(S.vertical ? 46 : 58)};line-height:1.06;letter-spacing:-.02em;`;
    const parts = String(side.text || '').split(/(\*[^*]+\*)/);
    for (const part of parts) {
      if (!part) continue;
      const em = part.startsWith('*') && part.endsWith('*');
      const span = el('span', '', esc(em ? part.slice(1, -1) : part));
      if (em) span.style.cssText = `color:var(--accent);font-style:italic;`;
      t.appendChild(span);
    }
    h.appendChild(t);
    const rows = (side.items || []).slice(0, 4).map(it => {
      const r = el('div', 'mono', esc(it));
      r.style.cssText =
        `font-size:${px(19)};padding:${px(11)} 0;opacity:.72;` +
        `border-top:1px solid ${dark && S.light ? 'rgba(255,255,255,.16)' : 'var(--line)'};`;
      h.appendChild(r);
      return r;
    });
    n.appendChild(h);
    return { h, k, t, rows };
  });

  return {
    node: n,
    update(lt) {
      halves.forEach((side, i) => {
        const base = 0.06 + i * 0.12;
        const p = seg(lt, base, base + 0.45, E.expo);
        side.k.style.opacity = p.toFixed(3);
        side.t.style.opacity = p.toFixed(3);
        side.t.style.transform = `translateY(${((1 - p) * 18).toFixed(1)}px)`;
        side.rows.forEach((r, j) => {
          r.style.opacity = (seg(lt, base + 0.2 + j * 0.07, base + 0.6 + j * 0.07) * 0.72).toFixed(3);
        });
      });
    },
  };
};

const CAM_NAMES = ['push', 'pull', 'left', 'right', 'up', 'down', 'pushleft',
                   'pushright', 'pullup', 'arc', 'sway', 'breathe', 'tilt',
                   'handheld', 'rotate', 'driftin', 'driftout', 'floatup',
                   'lean', 'snapzoom', 'none'];

/**
 * Shot-level entrance and exit.
 * Returns the transform pieces plus an optional clip-path and blur, so a
 * transition can cut the frame as well as move it.
 */
function transition(shot, lt, rt) {
  const IN = 0.42, OUT = 0.34;
  const i = clamp(lt / IN), o = clamp(rt / OUT);   // rt = time remaining
  const fade = Math.min(E.expo(i), E.out(o));
  const ei = E.expo(i);
  const st = { op: fade, tx: 0, ty: 0, sc: 1, rot: 0, blur: 0, clip: '' };

  switch (shot.in || 'fade') {
    case 'cut':    st.op = (lt >= 0 && rt >= 0) ? 1 : 0; break;
    case 'fade':   break;
    case 'push':   st.tx = (1 - ei) * 7; break;
    case 'pushback': st.tx = -(1 - ei) * 7; break;
    case 'rise':   st.ty = (1 - ei) * 5; break;
    case 'drop':   st.ty = -(1 - ei) * 5; break;
    case 'zoom':   st.sc = lerp(1.09, 1, ei); break;
    case 'zoomout': st.sc = lerp(0.92, 1, ei); break;
    case 'flash':  st.op = Math.min(1, E.expo(Math.min(1, i * 2.4)), E.out(o)); break;
    case 'glitch': st.op = i > 0.10 ? Math.min(1, E.out(o)) : 0; break;
    case 'blur':   st.blur = (1 - ei) * 16; break;
    case 'swing':  st.rot = (1 - ei) * -2.4; st.ty = (1 - ei) * 2.5; break;
    case 'spring': st.sc = lerp(0.88, 1, E.spring(i)); break;
    // Clip-based reveals. The content does not move; the frame uncovers it.
    case 'wipe':   st.clip = `inset(0 ${((1 - ei) * 100).toFixed(2)}% 0 0)`; break;
    case 'wipeleft': st.clip = `inset(0 0 0 ${((1 - ei) * 100).toFixed(2)}%)`; break;
    case 'wipeup': st.clip = `inset(${((1 - ei) * 100).toFixed(2)}% 0 0 0)`; break;
    case 'wipedown': st.clip = `inset(0 0 ${((1 - ei) * 100).toFixed(2)}% 0)`; break;
    case 'iris':   st.clip = `circle(${(ei * 78).toFixed(2)}% at 50% 50%)`; break;
    case 'barsin': {
      // Two bands closing in from top and bottom.
      const k = ((1 - ei) * 50).toFixed(2);
      st.clip = `inset(${k}% 0 ${k}% 0)`;
      break;
    }
    case 'splitin': {
      const k = ((1 - ei) * 50).toFixed(2);
      st.clip = `inset(0 ${k}% 0 ${k}%)`;
      break;
    }
    case 'irisout': st.clip = `circle(${(28 + ei * 54).toFixed(2)}% at 50% 50%)`; break;
    case 'wipediag': {
      const k = (1 - ei) * 100;
      st.clip = `polygon(0% 0%, ${(100 - k).toFixed(1)}% 0%, ${(100 - k * 1.6).toFixed(1)}% 100%, 0% 100%)`;
      break;
    }
    case 'slideup':   st.ty = (1 - ei) * 12; st.op = Math.min(1, E.out(o)); break;
    case 'slidedown': st.ty = -(1 - ei) * 12; st.op = Math.min(1, E.out(o)); break;
    case 'tiltin':    st.rot = (1 - ei) * 3.2; st.sc = lerp(1.06, 1, ei); break;
    case 'blurzoom':  st.blur = (1 - ei) * 14; st.sc = lerp(1.12, 1, ei); break;
    case 'softcut':   st.op = Math.min(E.out(clamp(lt / 0.14)), E.out(clamp(rt / 0.14))); break;
    case 'bloomin':   st.op = Math.min(1, E.expo(i) * 1.3); st.blur = (1 - ei) * 7; break;
    default: break;
  }
  return st;
}

/** Every transition the engine knows, for the catalogue and the self-test. */
const IN_NAMES = ['cut', 'fade', 'push', 'pushback', 'rise', 'drop', 'zoom',
                  'zoomout', 'flash', 'glitch', 'blur', 'swing', 'spring',
                  'wipe', 'wipeleft', 'wipeup', 'wipedown', 'iris', 'barsin',
                  'splitin', 'irisout', 'wipediag', 'slideup', 'slidedown',
                  'tiltin', 'blurzoom', 'softcut', 'bloomin'];

function build() {
  const dom = S.dom;
  dom.innerHTML = '';
  S.built = [];
  for (const shot of S.shots) {
    const fn = BUILD[shot.type] || BUILD.title;
    let inst;
    try { inst = fn(shot.data || {}); }
    catch (e) {
      // Falling back keeps the film running, but it also makes a broken shot
      // look like a working one -- the substituted title card paints elements
      // and probes clean. Record it so a probe can tell them apart.
      console.warn('shot build failed', shot.type, e);
      S.buildFallbacks = (S.buildFallbacks || []);
      S.buildFallbacks.push(shot.type + ': ' + (e && e.message || e));
      inst = BUILD.title({ text: shot.type });
    }
    inst.node.style.opacity = '0';
    inst.shot = shot;
    dom.appendChild(inst.node);
    S.built.push(inst);
  }
}

function seek(t) {
  S.t = t;
  const th = S.theme;

  // --- which shot owns this instant --------------------------------------
  let active = -1;
  for (let i = 0; i < S.shots.length; i++) {
    const s = S.shots[i];
    if (t >= s.start - 0.001 && t < s.start + s.dur) { active = i; break; }
  }
  if (active < 0) active = t < 0 ? 0 : S.shots.length - 1;
  const shot = S.shots[active];
  const lt = t - shot.start;
  const rt = shot.start + shot.dur - t;
  const p = clamp(lt / shot.dur);

  // --- background bed -----------------------------------------------------
  drawGL(shot.bg || th.bg_mode || 'aurora', shot.energy ?? 0.6, t);

  // --- 2D effects ---------------------------------------------------------
  fxClear();
  const fxp = clamp(lt / Math.min(1.2, shot.dur));
  runFx(shot.fx, t, fxp, th);
  if (shot.type === 'globe') {
    const cx = S.vertical ? S.W * 0.5 : S.W * 0.74;
    const cy = S.vertical ? S.H * 0.68 : S.H * 0.5;
    const R = (S.vertical ? S.W * 0.40 : S.H * 0.40);
    drawGlobe(t, cx, cy, R, E.expo(clamp(lt / 1.1)), th.fg, th.accent2);
  }
  if (shot.in === 'glitch') {
    const g = clamp(1 - lt / 0.30);
    if (g > 0) FX.glitch(S.fxCtx, g, Math.floor(t * 24) + shot.start * 100, th, S.W, S.H);
  }

  // --- DOM layers ---------------------------------------------------------
  for (let i = 0; i < S.built.length; i++) {
    const inst = S.built[i];
    if (i !== active) {
      if (inst.node.style.opacity !== '0') {
        inst.node.style.opacity = '0';
        inst.node.style.visibility = 'hidden';
      }
      continue;
    }
    inst.node.style.visibility = 'visible';
    const st = transition(shot, lt, rt);
    const cam = camera(shot, p, lt);
    inst.node.style.opacity = st.op.toFixed(3);
    inst.node.style.transform =
      `translate(${(st.tx + cam.x).toFixed(3)}%, ${(st.ty + cam.y).toFixed(3)}%) ` +
      `scale(${(st.sc * cam.s).toFixed(4)}) ` +
      `rotate(${(st.rot + cam.r).toFixed(3)}deg)`;
    inst.node.style.filter = st.blur > 0.05 ? `blur(${st.blur.toFixed(2)}px)` : '';
    inst.node.style.clipPath = st.clip || '';
    // A bad shot must not kill the film, but swallowing the error silently
    // makes a generated one look like it worked. Keep the last failure so a
    // probe can report it.
    try { inst.update(lt, p); }
    catch (e) { S.lastShotError = (shot && shot.type || '?') + ': ' + (e && e.message || e); }
  }

  // --- frame furniture --------------------------------------------------
  drawHud(shot, active, t, lt);

  // --- post -----------------------------------------------------------
  const flashEl = document.getElementById('flash');
  let flash = 0;
  if (shot.in === 'flash') flash = Math.max(0, 1 - lt / 0.22) * 0.92;
  if (shot.in === 'glitch') flash = Math.max(0, 1 - lt / 0.10) * 0.5;
  flashEl.style.opacity = flash.toFixed(3);

  document.getElementById('scan').style.opacity = (th.scanlines ? 0.42 : 0).toFixed(2);
  document.getElementById('grain').style.opacity = (th.grain ?? 0.055).toFixed(3);
  document.getElementById('vig').style.opacity = (th.vignette ?? 1).toFixed(2);

  // Letterbox: the bars close in over the first beat and lift on the last,
  // so the film opens and closes rather than simply being cropped.
  const barH = th.letterbox ? S.H * 0.058 : 0;
  const close = Math.min(seg(t, 0.0, 0.85, E.expo),
                         seg(S.spec.duration - t, 0.0, 0.75, E.expo));
  const h = barH * close;
  const bars = document.getElementById('bars');
  bars.children[0].style.height = h.toFixed(1) + 'px';
  bars.children[1].style.height = h.toFixed(1) + 'px';

  // Grain steps at 8Hz rather than per frame. Real film grain reads on a
  // two-frame hold anyway, and uncorrelated noise on every frame is the most
  // expensive thing in the file -- this alone cuts the encoded size by more
  // than half without changing how it looks.
  const gi = Math.floor(t * 8) % 8;
  document.getElementById('grain').style.backgroundPosition =
    `${(gi * 37) % 180}px ${(gi * 71) % 180}px`;
}

/* =======================================================================
   Public API -- the only surface the renderer touches
   ======================================================================= */

async function load(spec) {
  S.spec = spec;
  S.shots = spec.shots;
  S.theme = spec.theme;
  S.W = spec.width; S.H = spec.height;
  S.vertical = S.H > S.W;

  const stage = document.getElementById('stage');
  stage.style.width = S.W + 'px';
  stage.style.height = S.H + 'px';

  const th = S.theme;
  const root = document.documentElement.style;
  root.setProperty('--bg', th.bg);
  root.setProperty('--fg', th.fg);
  root.setProperty('--accent', th.accent);
  root.setProperty('--accent2', th.accent2);
  root.setProperty('--muted', rgba(th.fg, 0.55));
  root.setProperty('--line', rgba(th.fg, 0.15));
  root.setProperty('--grain-src', grainURI(spec.seed || 1));
  // An editorial theme swaps the display face for the serif register. Body
  // copy and monospace are untouched -- only the type that carries the idea.
  // Product surfaces are built relative to the ground, so the shell needs to
  // know which way round it is: a panel is lighter than a dark page and darker
  // than a light one. This must be set before build(), which constructs the
  // shots -- setting it later leaves every panel dark on a cream theme, with
  // near-black body text on it.
  S.buildFallbacks = [];
  S.light = relLum(th.bg) > 0.45;
  S.serif = th.face === 'serif';
  stage.classList.toggle('serifset', S.serif);
  stage.classList.toggle('lightset', S.light);
  root.setProperty('--display-face', S.serif ? 'var(--serif)' : '"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif');

  const bgc = document.getElementById('bg');
  S.BW = Math.max(2, Math.round(S.W * BG_SCALE));
  S.BH = Math.max(2, Math.round(S.H * BG_SCALE));
  bgc.width = S.BW; bgc.height = S.BH;
  const fxc = document.getElementById('fx');
  fxc.width = S.W; fxc.height = S.H;
  S.gl = initGL(document.getElementById('bg'));
  S.fxCtx = document.getElementById('fx').getContext('2d');
  S.dom = document.getElementById('dom');
  const hudRoot = document.getElementById('hud');
  S.hudEls = {
    root: hudRoot,
    tl: hudRoot.querySelector('.hud-tl'), tr: hudRoot.querySelector('.hud-tr'),
    bl: hudRoot.querySelector('.hud-bl'),
    brText: hudRoot.querySelector('.hud-br span'),
    chapter: hudRoot.querySelector('.hud-chapter'),
    chapterText: hudRoot.querySelector('.hud-chapter span'),
    cap: hudRoot.querySelector('.hud-cap'),
    capLead: hudRoot.querySelector('.hud-cap b'),
    capTail: hudRoot.querySelector('.hud-cap span'),
  };
  hudRoot.style.setProperty('--hp', (S.W * 0.042).toFixed(1) + 'px');
  hudRoot.style.setProperty('--vp', (S.H * 0.05).toFixed(1) + 'px');
  hudRoot.style.setProperty('--hs', (S.H * 0.0165).toFixed(2) + 'px');
  hudRoot.querySelector('.hud-cap').style.fontSize = (S.H * 0.026).toFixed(2) + 'px';

  seedFx();
  build();
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  seek(0);
  return true;
}

/**
 * The counter, section name, timecode, status stamp and caption.
 *
 * Driven from seek like everything else, so it is a pure function of t: the
 * timecode is computed from the frame being asked for, never from a clock.
 */
function drawHud(shot, index, t, lt) {
  const hud = S.hudEls;
  if (!hud) return;
  const on = S.spec.hud !== false && (S.spec.hud || shot.hud);
  hud.root.style.opacity = on ? '1' : '0';
  if (!on) return;

  const fps = S.spec.fps || 30;
  const frames = Math.max(0, Math.round(t * fps));
  const mm = String(Math.floor(frames / (fps * 60))).padStart(2, '0');
  const ss = String(Math.floor(frames / fps) % 60).padStart(2, '0');
  const ff = String(frames % fps).padStart(2, '0');

  hud.tl.textContent = `${S.spec.hud_label || S.spec.project || ''} / `
                     + String(index + 1).padStart(2, '0');
  hud.tr.textContent = shot.section || '';
  hud.bl.textContent = `${mm}:${ss}:${ff}`;
  // Says plainly whether what is on screen was measured or made up.
  hud.brText.textContent = shot.sample ? 'sample data' : 'measured';

  if (shot.chapter) {
    hud.chapter.style.opacity = seg(lt, 0.04, 0.4).toFixed(3);
    hud.chapterText.textContent = shot.chapter;
  } else {
    hud.chapter.style.opacity = '0';
  }

  if (shot.caption) {
    // A caption reads as a lead and a tail: the first clause carries the
    // point, the rest supports it.
    const m = String(shot.caption).match(/^(\S+(?:\s+\S+){0,2})\s+([\s\S]+)$/);
    hud.capLead.textContent = m ? m[1] : shot.caption;
    hud.capTail.textContent = m ? m[2] : '';
    const dur = Math.max(shot.dur, 0.6);
    const inP = seg(lt, 0.12, 0.52, E.expo);
    const outP = 1 - seg(lt, dur - 0.42, dur, E.expo);
    hud.cap.style.opacity = Math.min(inP, outP).toFixed(3);
    hud.cap.style.transform =
      `translateX(-50%) translateY(${((1 - inP) * 10).toFixed(1)}px)`;
  } else {
    hud.cap.style.opacity = '0';
  }
}

/** A small tiled noise bitmap, generated once, used as the film grain. */
function grainURI(seed) {
  const n = 128;
  const c = document.createElement('canvas');
  c.width = c.height = n;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(n, n);
  const r = rng(seed);
  // Speckle, not a grey wash: each pixel is pure black or white with a random
  // alpha. That reads as film grain under `normal` compositing, so we never
  // pay for a blend mode on the capture path.
  for (let i = 0; i < n * n; i++) {
    const up = r() > 0.5;
    const a = Math.pow(r(), 2.2) * 255;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = up ? 255 : 0;
    img.data[i * 4 + 3] = a;
  }
  ctx.putImageData(img, 0, 0);
  return `url(${c.toDataURL('image/png')})`;
}

window.__CASED = {
  load, seek, register: registerShot,
  get duration() { return S.spec ? S.spec.duration : 0; },
  get size() { return [S.W, S.H]; },
};

/* =======================================================================
   postMessage transport
   -----------------------------------------------------------------------
   The renderer drives this page directly through __CASED, because
   Playwright owns the page. A browser embedding it does not get that:
   the page is framed with sandbox="allow-scripts" and no
   allow-same-origin, so the parent cannot reach in -- which is the
   point. The host's localStorage holds the viewer's API keys, and shot
   code written by a model runs in here.

   So the frame is driven by message instead. Every call answers with
   {id, ok, value} or {id, ok:false, error}, and the frame announces
   itself once it is ready so the host does not have to poll.
   ======================================================================= */
/* --- generated shots ---------------------------------------------------
 *
 * A model can write a builder and have it rendered here. The contract is
 * narrow on purpose: a builder is an expression evaluating to
 * (d, api) => ({ node, update(lt) }), it may touch only the helpers handed
 * to it in `api`, and -- the rule the whole renderer rests on -- its output
 * must be a pure function of lt. The frame-stepped capture asks for frames
 * in whatever order it likes, so a builder that reads the clock or draws a
 * random number produces a different film every time it is rendered.
 *
 * Nothing here trusts the source. It is compiled, then rendered, then
 * checked; the caller decides what to do when a check fails.
 */
/**
 * Identifiers a generated builder must not reach. They are shadowed as
 * parameters bound to undefined rather than grepped for, because a word list
 * cannot tell `top` the global from `top:50%` in a style string -- the first
 * version of this rejected a perfectly good shot for writing CSS.
 *
 * Security does not rest on this. The frame is sandboxed to an opaque origin,
 * so there is nothing here worth taking, and its CSP sets connect-src 'none',
 * so there is nowhere to send it. This is here to stop accidents.
 */
const SHADOWED = [
  'window', 'parent', 'top', 'self', 'globalThis', 'document', 'location',
  'history', 'navigator', 'fetch', 'XMLHttpRequest', 'WebSocket', 'EventSource',
  'localStorage', 'sessionStorage', 'indexedDB', 'caches', 'Worker',
  'postMessage', 'Function', 'Date', 'performance',
  'requestAnimationFrame', 'cancelAnimationFrame', 'requestIdleCallback',
  'setTimeout', 'setInterval', 'queueMicrotask', 'crypto',
];

/**
 * Determinism cannot be shadowed away -- Math is needed and Math.random sits
 * on it -- so the one entropy source gets a pattern. Every visual in this
 * engine is a pure function of seek(t); a builder that draws a random number
 * renders a different film each time the capture asks for a frame.
 */
const NON_DETERMINISTIC = /Math\s*\.\s*random/;

/** `eval` cannot be shadowed -- it is not a legal parameter name under strict
 *  mode -- so it is the one identifier still matched by pattern. */
const DIRECT_EVAL = /\beval\s*\(/;

/** The only surface a generated builder gets. */
function shotAPI() {
  return {
    el, px, esc, seg, clamp, lerp, rng, E,
    // A read-only view of the frame: size, orientation, ground, palette.
    stage: {
      W: S.W, H: S.H, vertical: S.vertical, light: S.light, serif: S.serif,
      theme: Object.freeze({ ...S.theme }),
    },
  };
}

/**
 * Render at a few points and report what actually happened.
 *
 * seek() deliberately swallows a shot's errors so one bad layer cannot kill a
 * film, which means a generated shot that throws on every frame looks exactly
 * like one that works. This reports the swallowed error, how much got drawn,
 * and a signature of the drawn DOM -- enough for the host to tell a working
 * shot from a blank one, and a deterministic shot from one that drifts.
 */
function probe(times) {
  const out = [];
  for (const t of times) {
    S.lastShotError = null;
    let a, b;
    try { seek(t); a = snapshot(); seek(t); b = snapshot(); }
    catch (e) { out.push({ t, error: String(e && e.message || e), visible: 0 }); continue; }
    out.push({
      t,
      // A build failure is reported as an error too: the film kept running on
      // a substituted title card, which is not the shot that was asked for.
      error: S.lastShotError || ((S.buildFallbacks || []).length ? S.buildFallbacks[0] : null),
      visible: a.visible,
      // Same time asked twice must produce the same frame, or the capture --
      // which requests frames in whatever order it likes -- cannot be trusted.
      stable: a.sig === b.sig,
      sig: a.sig,
    });
  }
  return out;
}

/** Visible element count plus a cheap structural fingerprint. */
function snapshot() {
  const dom = S.dom;
  if (!dom) return { visible: 0, sig: '' };
  let visible = 0, sig = '';
  for (const e of dom.querySelectorAll('*')) {
    const r = e.getBoundingClientRect();
    if (r.width > 1 && r.height > 1) {
      visible++;
      if (sig.length < 4000) {
        sig += e.tagName + Math.round(r.x) + ',' + Math.round(r.y) + ',' +
               Math.round(r.width) + ',' + Math.round(r.height) +
               '|' + (e.style.opacity || '') + (e.style.transform || '') + ';';
      }
    }
  }
  return { visible, sig };
}

function registerShot(name, source) {
  if (!/^gen[A-Za-z0-9_]{1,40}$/.test(String(name || ''))) {
    return { ok: false, error: 'a generated shot must be named genSomething' };
  }
  const src = String(source || '');
  if (src.length > 20000) return { ok: false, error: 'source too long' };
  if (NON_DETERMINISTIC.test(src)) {
    return { ok: false, error: 'uses Math.random; every visual must be a pure function of lt' };
  }
  if (DIRECT_EVAL.test(src)) return { ok: false, error: 'uses eval' };
  let factory;
  try {
    const body = '"use strict"; return (' + src + ');';
    factory = new Function(...SHADOWED, 'api', body)(...SHADOWED.map(() => undefined), shotAPI());
  } catch (e) {
    return { ok: false, error: 'did not compile: ' + (e && e.message) };
  }
  if (typeof factory !== 'function') return { ok: false, error: 'did not evaluate to a function' };
  BUILD[name] = (d) => {
    const made = factory(d, shotAPI());
    if (!made || !made.node || typeof made.update !== 'function') {
      throw new Error(name + ' returned no { node, update }');
    }
    return made;
  };
  // Registering means it compiled. Whether it draws anything, and whether it
  // draws the same thing twice, is settled by rendering it.
  return { ok: true, value: name };
}

addEventListener('message', async (ev) => {
  const msg = ev.data;
  if (!msg || msg.channel !== 'cased') return;
  const reply = (body) => {
    // ev.source is the frame's opener; the opaque origin means '*' is the
    // only usable target, and nothing secret travels this way.
    try { ev.source.postMessage({ channel: 'cased', id: msg.id, ...body }, '*'); }
    catch (e) { /* host went away */ }
  };
  try {
    switch (msg.call) {
      case 'register': return reply(registerShot(msg.name, msg.source));
      case 'probe':    return reply({ ok: true, value: probe(msg.times || [0.3, 0.6, 0.9]) });
      case 'load':     await load(msg.spec); return reply({ ok: true, value: S.spec.duration });
      case 'seek':     seek(msg.t);          return reply({ ok: true });
      case 'duration': return reply({ ok: true, value: S.spec ? S.spec.duration : 0 });
      case 'size':     return reply({ ok: true, value: [S.W, S.H] });
      case 'ping':     return reply({ ok: true, value: 'ready' });
      default:         return reply({ ok: false, error: 'unknown call: ' + msg.call });
    }
  } catch (e) {
    reply({ ok: false, error: String(e && e.message || e) });
  }
});

try { parent.postMessage({ channel: 'cased', event: 'ready' }, '*'); } catch (e) { /* not framed */ }
</script>
</body>
