<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Shot code written by a model is compiled in this document. It has nothing
     worth stealing -- the frame is sandboxed to an opaque origin, so no
     localStorage, no parent DOM -- and connect-src 'none' means it cannot send
     anywhere either. 'unsafe-eval' is what compiles a generated builder. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>cased2.0 stage</title>
<style>
  /* ---------------------------------------------------------------------
     The stage is a fixed-size, deterministic canvas. Nothing here animates
     on its own: every visual property is a pure function of seek(t), so a
     frame rendered at t is byte-identical no matter when it is asked for.
     --------------------------------------------------------------------- */
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#000; overflow:hidden; }

  :root {
    --bg:#07070A; --fg:#FFFFFF; --accent:#FF4D8D; --accent2:#00E5FF;
    --muted:rgba(255,255,255,.52); --line:rgba(255,255,255,.14);
    --display:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
    --serif:"Playfair Display","Didot","Bodoni MT","Noto Serif Display",
            "Liberation Serif","Times New Roman",Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
  }

  #stage {
    position:relative; overflow:hidden; background:var(--bg);
    transform-origin:0 0; font-family:var(--display);
    color:var(--fg); -webkit-font-smoothing:antialiased;
  }
  #bg, #fx { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #dom { position:absolute; inset:0; }

  .layer { position:absolute; inset:0; will-change:transform,opacity; }

  /* --- post-processing overlays ------------------------------------- */
  #grain {
    position:absolute; inset:0; pointer-events:none; opacity:.055;
    background-image:var(--grain-src); background-size:180px 180px;
  }
  #scan {
    position:absolute; inset:0; pointer-events:none; opacity:0;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,.30) 0 1px, rgba(0,0,0,0) 1px 3px);
    mix-blend-mode:multiply;
  }
  #vig {
    position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(130% 115% at 50% 46%,
      rgba(0,0,0,0) 38%, rgba(0,0,0,.42) 78%, rgba(0,0,0,.78) 100%);
  }
  #flash { position:absolute; inset:0; pointer-events:none; opacity:0; background:#fff; }
  #bars  { position:absolute; inset:0; pointer-events:none; }
  #bars i { position:absolute; left:0; right:0; height:0; background:#000; display:block; }
  #bars i.t { top:0; } #bars i.b { bottom:0; }

  /* --- typography ---------------------------------------------------- */
  .kicker {
    font-family:var(--mono); font-size:var(--k,15px); letter-spacing:.34em;
    text-transform:uppercase; color:var(--accent); font-weight:600;
  }
  .display {
    font-family:var(--display-face,var(--display));
    font-weight:800; letter-spacing:-.045em; line-height:.88;
    text-transform:none; font-size:var(--s,120px);
  }
  /* A high-contrast serif wants less negative tracking and more leading
     than a grotesque, or the descenders collide. */
  .serifset .display { font-weight:600; letter-spacing:-.012em; line-height:1.0; }
  .display.caps { text-transform:uppercase; letter-spacing:-.025em; }
  .sub { font-size:var(--s,26px); line-height:1.38; color:var(--muted); font-weight:400; }
  .mono { font-family:var(--mono); }

  .word { display:inline-block; white-space:pre; will-change:transform,opacity; }
  .char { display:inline-block; white-space:pre; will-change:transform,opacity; }
  .clipline { display:block; overflow:hidden; }

  /* --- retro window chrome (TypeSafe reference) ---------------------- */
  .win { position:absolute; background:#D8D8D4; border:2px solid #111;
         box-shadow:7px 7px 0 rgba(0,0,0,.55); overflow:hidden; }
  .win > .bar {
    background:#111; color:#fff; font-family:var(--mono); font-size:17px;
    padding:7px 12px; display:flex; justify-content:space-between;
    align-items:center; letter-spacing:.04em;
  }
  .win > .bar .dots { display:flex; gap:6px; }
  .win > .bar .dots b { width:11px; height:11px; background:#fff; display:block; }
  .win > .body { padding:18px 20px; font-family:var(--mono); color:#111; }

  /* --- terminal window (code shots) ---------------------------------- */
  .term { position:absolute; background:rgba(8,9,14,.93); border:1px solid var(--line);
          border-radius:12px; overflow:hidden;
          box-shadow:0 48px 120px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.04) inset; }
  .term .tbar { display:flex; align-items:center; gap:11px; padding:17px 22px;
                border-bottom:1px solid var(--line); font-family:var(--mono);
                font-size:19px; color:var(--muted); }
  .term .tbar u { width:13px; height:13px; border-radius:50%; display:block; opacity:.85; }
  .term pre { padding:26px 30px; font-family:var(--mono); line-height:1.56;
              font-size:var(--cs,21px); color:#C9D4E4; white-space:pre; }
  .tok-k { color:var(--accent); font-weight:600; }
  .tok-s { color:#8FE39A; }
  .tok-n { color:#F0B86E; }
  .tok-c { color:rgba(255,255,255,.3); font-style:italic; }
  .tok-f { color:var(--accent2); }
  .tok-p { color:rgba(255,255,255,.44); }
  /* Product shots put an editor on a white panel, where white-on-white
     tokens disappear. Same roles, inked for paper. */
  .lightset .tok-s { color:#1A7F37; }
  .lightset .tok-n { color:#9A5B00; }
  .lightset .tok-c { color:rgba(0,0,0,.40); }
  .lightset .tok-p { color:rgba(0,0,0,.52); }
  .caret { display:inline-block; width:.58em; height:1.05em; background:var(--accent2);
           vertical-align:-.18em; }

  /* --- the frame furniture -------------------------------------------
     A counter, the section name, a running timecode, a status dot and a
     caption. Pure chrome: it carries no claim the film does not already
     make, and the stamp bottom-right says whether what is on screen was
     measured or invented. */
  #hud { position:absolute; inset:0; pointer-events:none; opacity:0;
         font-variant-numeric:tabular-nums; }
  #hud > div { position:absolute; color:var(--muted); }
  #hud .mono { font-family:var(--mono); letter-spacing:.2em;
               text-transform:uppercase; }
  .hud-tl { left:var(--hp); top:var(--vp); font-size:var(--hs); }
  .hud-tr { right:var(--hp); top:var(--vp); font-size:var(--hs); text-align:right; }
  .hud-bl { left:var(--hp); bottom:var(--vp); font-size:var(--hs); }
  .hud-br { right:var(--hp); bottom:var(--vp); font-size:var(--hs);
            display:flex; align-items:center; gap:.7em; }
  .hud-br i { width:.5em; height:.5em; border-radius:50%; background:var(--accent);
              display:block; }
  .hud-chapter { left:var(--hp); top:calc(var(--vp) + var(--hs) * 2.3);
                 display:flex; align-items:center; gap:.7em; }
  .hud-chapter i { width:.5em; height:.5em; border-radius:50%; background:var(--accent);
                   display:block; }
  .hud-chapter span { font-size:var(--hs); color:var(--fg); opacity:.78; }
  #hud .hud-cap { left:50%; transform:translateX(-50%);
             bottom:calc(var(--vp) * 1.55); max-width:76%;
             display:flex; gap:.4em; align-items:baseline; white-space:nowrap;
             padding:.7em 1.1em; border-radius:.6em;
             background:rgba(10,10,12,.82); color:rgba(255,255,255,.62); }
  #hud .hud-cap b { color:#fff; font-weight:650; }
  #hud .hud-cap span { color:rgba(255,255,255,.66); }

  /* --- misc parts ---------------------------------------------------- */
  .rule { background:var(--line); }
  .chip { display:inline-block; font-family:var(--mono); font-size:16px;
          letter-spacing:.14em; text-transform:uppercase; padding:9px 16px;
          border:1px solid var(--line); border-radius:999px; color:var(--muted); }
  .crop { position:absolute; width:26px; height:26px; border:2px solid var(--fg); opacity:.3; }
  .bigstat { font-weight:800; letter-spacing:-.06em; line-height:.82; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="fx"></canvas>
  <div id="dom"></div>
  <div id="grain"></div>
  <div id="scan"></div>
  <div id="vig"></div>
  <div id="flash"></div>
  <div id="bars"><i class="t"></i><i class="b"></i></div>
  <div id="hud">
    <div class="hud-tl mono"></div><div class="hud-tr mono"></div>
    <div class="hud-chapter"><i></i><span class="mono"></span></div>
    <div class="hud-bl mono"></div><div class="hud-br mono"><i></i><span></span></div>
    <div class="hud-cap"><b></b><span></span></div>
  </div>
</div>
<script>
/* =======================================================================
   cased2.0 scene engine
   -----------------------------------------------------------------------
   One rule governs this file: every visual is a pure function of time.
   There are no CSS animations, no requestAnimationFrame loops driving
   state, and no Date.now(). The renderer calls seek(t) for each frame it
   wants, in any order, and gets back exactly the same pixels every time.
   That is what makes the output reproducible from a seed.
   ======================================================================= */
'use strict';

const S = {
  spec: null, shots: [], theme: null,
  W: 1920, H: 1080, t: 0,
  gl: null, glProg: null, glU: {}, glBuf: null,
  fx: null, fxCtx: null, dom: null,
  built: false, stars: [], arcs: [], motes: [],
};

/* --- deterministic RNG (mulberry32) ----------------------------------- */
function rng(seed) {
  let a = (seed >>> 0) || 1;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** sRGB relative luminance, for deciding if a ground reads as light. */
function relLum(hex) {
  const h = String(hex || '').replace('#', '');
  if (h.length < 6) return 0;
  const c = [0, 2, 4].map(i => {
    const v = parseInt(h.slice(i, i + 2), 16) / 255;
    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}

/* --- easing ----------------------------------------------------------- */
const E = {
  lin:  t => t,
  out:  t => 1 - Math.pow(1 - t, 3),
  expo: t => (t >= 1 ? 1 : 1 - Math.pow(2, -11 * t)),
  inExpo: t => (t <= 0 ? 0 : Math.pow(2, 11 * (t - 1))),
  inOut: t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  back: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  // Critically-ish damped spring. Settles without the cartoon overshoot.
  spring: t => (t >= 1 ? 1 : 1 - Math.pow(2, -9 * t) * Math.cos(t * 13.2)),
};

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
/** Normalised progress of `t` across [a,b], eased. */
const seg = (t, a, b, ease = E.out) => ease(clamp((t - a) / Math.max(b - a, 1e-6)));

function hex2rgb(h) {
  h = (h || '#000').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
const rgba = (h, a) => { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };

/* =======================================================================
   WebGL background beds
   -----------------------------------------------------------------------
   Fifty backgrounds, each a small GLSL function returning a colour for a
   normalised uv.

   They are compiled *lazily, one program per bed*. Putting fifty bodies
   behind an `if` chain in a single shader would compile all fifty every
   time the stage loads, and under SwiftShader -- which is what you get in
   any CI container, since there is no GPU -- that costs seconds before the
   first frame. A typical film uses four or five beds, so this pays for
   four or five.
   ======================================================================= */

const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

/** Uniforms and the noise toolkit every bed shares. */
const GL_PRELUDE = `
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_energy;
uniform float u_seed;
uniform vec3  u_bg;
uniform vec3  u_a1;
uniform vec3  u_a2;

const float PI = 3.14159265;

float hash11(float p){ return fract(sin(p * 127.1 + u_seed) * 43758.5453); }
float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)) + u_seed) * 43758.5453); }
vec2  hash22(vec2 p){
  return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))
                   + u_seed) * 43758.5453);
}

float n2(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
             mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x), u.y);
}

float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){ v += a * n2(p); p *= 2.03; a *= 0.5; }
  return v;
}

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

/** Cell id + distance to the nearest feature point. */
vec3 worley(vec2 p){
  vec2 ip = floor(p), fp = fract(p);
  float d = 8.0; vec2 id = vec2(0.0);
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++){
    vec2 g = vec2(float(x), float(y));
    vec2 o = hash22(ip + g);
    o = 0.5 + 0.45 * sin(u_time * 0.35 + 6.2831 * o);
    float dist = length(g + o - fp);
    if (dist < d){ d = dist; id = ip + g; }
  }
  return vec3(d, id);
}

/** Aspect-corrected centred coordinates. */
vec2 cen(vec2 uv){ return (uv - 0.5) * vec2(u_res.x / u_res.y, 1.0); }

/** Mix toward accent 1 then accent 2, scaled by energy. The house gradient. */
vec3 tint(float a, float b){
  vec3 c = mix(u_bg, u_a1, clamp(a, 0.0, 1.0) * (0.42 + u_energy * 0.45));
  return mix(c, u_a2, clamp(b, 0.0, 1.0) * (0.24 + u_energy * 0.32));
}
`;

/** Wrapper that every bed body is compiled into. */
const GL_MAIN = `
void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  vec3 col = bed(uv);
  float v = smoothstep(1.15, 0.22, length(uv - 0.5));
  col *= mix(0.72, 1.0, v);
  gl_FragColor = vec4(col, 1.0);
}
`;

/**
 * The library. Each entry is the body of `vec3 bed(vec2 uv)`.
 * Keep them cheap: at most two fbm calls, since this is rasterised in
 * software at 960x540 for every frame of every film.
 */
const BEDS = {

/* ---- flowing fields -------------------------------------------------- */
aurora: `
  float t = u_time * 0.055;
  vec2 q = vec2(fbm(uv * 1.7 + vec2(t, t * 0.7)), fbm(uv * 1.7 + vec2(5.2, 1.3) - t * 0.6));
  float f = fbm(uv * 2.1 + q * 1.9 + t * 0.4);
  float g = fbm(uv * 3.3 - q * 1.2 - t * 0.25);
  return tint(smoothstep(0.28, 0.92, f), smoothstep(0.42, 1.0, g));`,

smoke: `
  float t = u_time * 0.03;
  float f = fbm(uv * 2.4 + vec2(t, -t * 0.6));
  float g = fbm(uv * 1.2 - vec2(t * 0.4, t));
  float m = smoothstep(0.30, 0.86, f * 0.7 + g * 0.5);
  return tint(m * 0.7, smoothstep(0.55, 1.0, g) * 0.5);`,

noisefield: `
  float f = fbm(uv * 6.0 + u_time * 0.04);
  float g = fbm(uv * 14.0 - u_time * 0.02);
  return tint(smoothstep(0.35, 0.8, f), g * 0.35);`,

warp: `
  vec2 p = uv * 3.0;
  vec2 w = vec2(fbm(p + u_time * 0.07), fbm(p + vec2(3.1, 1.7) - u_time * 0.05));
  float f = fbm(p + w * 2.6);
  return tint(smoothstep(0.30, 0.85, f), smoothstep(0.6, 1.0, w.x));`,

gradientfield: `
  float f = fbm(uv * 1.4 + u_time * 0.03);
  float d = uv.y * 0.75 + uv.x * 0.25 + (f - 0.5) * 0.35;
  return tint(1.0 - d, smoothstep(0.55, 1.0, d));`,

silk: `
  vec2 p = uv * vec2(3.0, 1.6);
  float f = sin(p.x * 3.0 + fbm(p + u_time * 0.05) * 5.0 + u_time * 0.25);
  float m = smoothstep(-0.2, 1.0, f) * 0.8;
  return tint(m, smoothstep(0.7, 1.0, m));`,

velvet: `
  vec2 p = cen(uv);
  float r = length(p);
  float f = fbm(uv * 5.0 + u_time * 0.02);
  float m = smoothstep(0.95, 0.05, r) * (0.6 + f * 0.5);
  return tint(m * 0.65, smoothstep(0.75, 0.0, r) * 0.4);`,

washes: `
  float a = fbm(uv * 2.2 + vec2(u_time * 0.02, 0.0));
  float b = fbm(uv * 3.1 - vec2(0.0, u_time * 0.018) + 4.0);
  float m = smoothstep(0.42, 0.78, a) * smoothstep(0.80, 0.35, b);
  return tint(m, smoothstep(0.52, 0.9, b) * 0.6);`,

curtains: `
  float x = uv.x * 4.0;
  float sway = fbm(vec2(x * 0.5, u_time * 0.10)) * 1.6;
  float band = sin(x * 2.4 + sway * 2.2 + u_time * 0.22) * 0.5 + 0.5;
  float fall = smoothstep(1.05, 0.05, uv.y + band * 0.22);
  return tint(band * fall, fall * 0.5);`,

nebula: `
  float a = fbm(uv * 2.3 + u_time * 0.016);
  float b = fbm(uv * 4.4 - u_time * 0.011 + 7.0);
  vec3 col = mix(u_bg, u_a1 * 0.9, smoothstep(0.45, 1.0, a) * 0.55);
  col = mix(col, u_a2 * 0.8, smoothstep(0.55, 1.0, b) * 0.40);
  for (int i = 0; i < 2; i++){
    float sc = 110.0 + float(i) * 140.0;
    vec2 g = uv * sc; vec2 id = floor(g);
    if (hash21(id + float(i) * 13.0) > 0.982){
      col += vec3(1.0) * smoothstep(0.32, 0.0, length(fract(g) - 0.5)) * 0.5;
    }
  }
  return col;`,

/* ---- space ----------------------------------------------------------- */
stars: `
  vec3 col = u_bg;
  float neb = fbm(uv * 2.6 + vec2(u_time * 0.025, 0.0));
  col = mix(col, u_a1 * 0.75, smoothstep(0.52, 1.0, neb) * 0.40);
  col = mix(col, u_a2 * 0.55, smoothstep(0.62, 1.0, fbm(uv * 4.0 - u_time * 0.015)) * 0.22);
  for (int i = 0; i < 3; i++){
    float sc = 90.0 + float(i) * 95.0;
    vec2 g = uv * sc; vec2 id = floor(g);
    float h = hash21(id + float(i) * 31.7);
    if (h > 0.976){
      float tw = 0.60 + 0.40 * sin(u_time * (1.6 + h * 3.4) + h * 28.0);
      col += vec3(1.0) * smoothstep(0.30, 0.0, length(fract(g) - 0.5)) * tw * (0.55 - float(i) * 0.13);
    }
  }
  return col;`,

corona: `
  vec2 p = cen(uv);
  float r = length(p);
  float a = atan(p.y, p.x);
  float rays = 0.5 + 0.5 * sin(a * 14.0 + u_time * 0.4 + fbm(vec2(a * 2.0, u_time * 0.1)) * 4.0);
  float core = smoothstep(0.75, 0.0, r);
  return tint(core * (0.45 + rays * 0.55), smoothstep(0.35, 0.0, r));`,

rays: `
  vec2 p = uv - vec2(0.5, 1.12);
  float a = atan(p.x, -p.y);
  float beam = 0.5 + 0.5 * sin(a * 22.0 + u_time * 0.3);
  beam *= smoothstep(1.1, 0.0, length(p));
  return tint(beam * 0.9, smoothstep(0.9, 0.1, uv.y) * 0.4);`,

bloom: `
  vec3 col = u_bg;
  for (int i = 0; i < 5; i++){
    float f = float(i);
    vec2 c = vec2(0.5 + 0.34 * sin(u_time * 0.21 + f * 2.1),
                  0.5 + 0.28 * cos(u_time * 0.17 + f * 1.7));
    float d = length((uv - c) * vec2(u_res.x / u_res.y, 1.0));
    float g = smoothstep(0.42, 0.0, d);
    col = mix(col, mod(f, 2.0) < 1.0 ? u_a1 : u_a2, g * (0.30 + u_energy * 0.30));
  }
  return col;`,

vortex: `
  vec2 p = cen(uv);
  float r = length(p);
  float a = atan(p.y, p.x) + r * 5.0 - u_time * 0.4;
  float arm = 0.5 + 0.5 * sin(a * 3.0);
  float m = arm * smoothstep(1.0, 0.04, r);
  return tint(m, smoothstep(0.5, 0.0, r) * 0.6);`,

tunnel: `
  vec2 p = cen(uv);
  float r = length(p) + 0.001;
  float a = atan(p.y, p.x);
  float z = 0.45 / r + u_time * 0.5;
  float ring = smoothstep(0.42, 0.5, fract(z));
  float spoke = smoothstep(0.44, 0.5, fract(a * 4.0 / PI));
  float m = max(ring, spoke * 0.6) * smoothstep(1.3, 0.1, r);
  return tint(m, smoothstep(0.26, 0.0, r));`,

starburst: `
  vec2 p = cen(uv);
  float a = atan(p.y, p.x), r = length(p);
  float lines = smoothstep(0.80, 1.0, sin(a * 28.0 + u_time * 0.25) * 0.5 + 0.5);
  float m = lines * smoothstep(1.1, 0.06, r);
  return tint(m, smoothstep(0.3, 0.0, r) * 0.8);`,

/* ---- geometric / technical ------------------------------------------- */
grid: `
  vec2 p = uv - 0.5;
  p.y = abs(p.y) + 0.035;
  vec2 g = vec2(p.x / p.y, 1.0 / p.y + u_time * 0.55);
  vec2 l = abs(fract(g * vec2(2.2, 0.9)) - 0.5);
  float w = smoothstep(0.055, 0.0, min(l.x, l.y)) * smoothstep(1.35, 0.06, p.y * 6.0);
  vec3 col = mix(u_bg, u_a1, w * (0.52 + u_energy * 0.48));
  col += u_a2 * smoothstep(0.42, 0.0, length(uv - 0.5)) * 0.14 * u_energy;
  return col;`,

sungrid: `
  vec3 col = u_bg;
  float sun = smoothstep(0.30, 0.0, length((uv - vec2(0.5, 0.62)) * vec2(u_res.x / u_res.y, 1.0)));
  float slice = step(0.5, fract(uv.y * 34.0 - u_time * 0.2));
  col = mix(col, u_a1, sun * mix(0.55, 1.0, slice));
  if (uv.y < 0.42){
    vec2 p = vec2(uv.x - 0.5, 0.44 - uv.y);
    vec2 g = vec2(p.x / max(p.y, 0.004), 1.0 / max(p.y, 0.004) + u_time * 0.55);
    vec2 l = abs(fract(g * vec2(1.6, 0.6)) - 0.5);
    float w = smoothstep(0.06, 0.0, min(l.x, l.y));
    col = mix(col, u_a2, w * 0.75);
  }
  return col;`,

checkerhorizon: `
  if (uv.y > 0.5) return mix(u_bg, u_a2 * 0.5, smoothstep(0.5, 1.0, uv.y) * 0.35);
  vec2 p = vec2(uv.x - 0.5, 0.52 - uv.y);
  float z = 1.0 / max(p.y, 0.004);
  vec2 g = vec2(p.x * z, z + u_time * 0.8);
  float c = mod(floor(g.x * 2.0) + floor(g.y * 0.6), 2.0);
  float fade = smoothstep(0.0, 0.42, uv.y);
  return mix(u_bg, mix(u_a1, u_a2, c), (0.25 + c * 0.5) * fade);`,

rulegrid: `
  vec2 g = uv * vec2(u_res.x / u_res.y, 1.0) * 18.0;
  vec2 l = abs(fract(g) - 0.5);
  float fine = smoothstep(0.48, 0.5, max(l.x, l.y));
  vec2 lb = abs(fract(g / 6.0) - 0.5);
  float bold = smoothstep(0.485, 0.5, max(lb.x, lb.y));
  return tint(fine * 0.22 + bold * 0.5, 0.0);`,

draft: `
  vec2 g = uv * vec2(u_res.x / u_res.y, 1.0) * 24.0;
  vec2 l = abs(fract(g) - 0.5);
  float fine = smoothstep(0.47, 0.5, max(l.x, l.y)) * 0.35;
  vec2 c = abs(fract(g / 8.0) - 0.5);
  float cross = (smoothstep(0.49, 0.5, c.x) + smoothstep(0.49, 0.5, c.y)) * 0.5;
  vec3 col = mix(u_bg, u_a1, fine * 0.5 + cross * 0.45);
  return col;`,

dotmatrix: `
  vec2 g = uv * vec2(u_res.x / u_res.y, 1.0) * 46.0;
  vec2 f = fract(g) - 0.5;
  float wave = 0.5 + 0.5 * sin(length(cen(uv)) * 14.0 - u_time * 1.6);
  float d = smoothstep(0.34 * (0.4 + wave), 0.0, length(f));
  return tint(d * (0.35 + wave * 0.65), 0.0);`,

halftone: `
  vec2 g = uv * vec2(u_res.x / u_res.y, 1.0) * 52.0;
  g = rot(0.4) * g;
  float v = fbm(uv * 2.2 + u_time * 0.04);
  float d = length(fract(g) - 0.5);
  float dot_ = smoothstep(v * 0.52, v * 0.52 - 0.06, d);
  return mix(u_bg, u_a1, dot_ * (0.22 + u_energy * 0.22));`,

circuit: `
  vec2 g = uv * vec2(u_res.x / u_res.y, 1.0) * 14.0;
  vec2 id = floor(g), f = fract(g);
  float h = hash21(id);
  float line = h < 0.5
    ? smoothstep(0.07, 0.0, abs(f.y - 0.5))
    : smoothstep(0.07, 0.0, abs(f.x - 0.5));
  float pad = smoothstep(0.17, 0.10, length(f - 0.5)) * step(0.86, h);
  float pulse = 0.45 + 0.55 * sin(u_time * 1.6 + h * 24.0);
  return tint(line * 0.4 + pad * pulse, pad * 0.8);`,

hexfield: `
  vec2 p = cen(uv) * 9.0;
  p.x *= 1.1547;
  p.y += mod(floor(p.x), 2.0) * 0.5;
  vec2 f = abs(fract(p) - 0.5);
  float e = smoothstep(0.46, 0.5, max(f.x, f.y));
  float pulse = 0.5 + 0.5 * sin(u_time * 0.9 - length(cen(uv)) * 6.0);
  return tint(e * (0.3 + pulse * 0.55), 0.0);`,

plates: `
  vec3 w = worley(uv * vec2(u_res.x / u_res.y, 1.0) * 5.0);
  float edge = smoothstep(0.12, 0.0, w.x);
  float fill = hash21(w.yz) * 0.4;
  return tint(edge * 0.75 + fill * 0.35, edge * 0.5);`,

facets: `
  vec3 w = worley(uv * vec2(u_res.x / u_res.y, 1.0) * 7.0);
  float shade = hash21(w.yz);
  vec3 col = mix(u_bg, mix(u_a1, u_a2, shade), 0.18 + shade * 0.34 * (0.5 + u_energy));
  return mix(col, u_bg, smoothstep(0.0, 0.07, w.x) * 0.0 + smoothstep(0.30, 0.0, w.x) * 0.25);`,

crystal: `
  vec3 w = worley(uv * vec2(u_res.x / u_res.y, 1.0) * 6.0);
  float edge = smoothstep(0.10, 0.0, w.x);
  float sheen = 0.5 + 0.5 * sin(hash21(w.yz) * 20.0 + u_time * 0.5);
  return tint(edge * 0.8, sheen * 0.3);`,

metaballs: `
  vec2 p = cen(uv);
  float s = 0.0;
  for (int i = 0; i < 5; i++){
    float f = float(i) + 1.0;
    vec2 c = vec2(sin(u_time * 0.31 * f + f) * 0.42, cos(u_time * 0.27 * f + f * 2.0) * 0.32);
    s += 0.035 / (dot(p - c, p - c) + 0.004);
  }
  float m = smoothstep(0.8, 1.9, s);
  return tint(m, smoothstep(1.6, 3.0, s));`,

/* ---- waves / water ---------------------------------------------------- */
waves: `
  float y = uv.y * 7.0;
  float w = sin(uv.x * 7.0 + u_time * 0.6) * 0.25
          + sin(uv.x * 13.0 - u_time * 0.4) * 0.12;
  float band = smoothstep(0.42, 0.5, abs(fract(y + w) - 0.5));
  float depth = smoothstep(1.0, 0.0, uv.y);
  return tint(band * depth * 0.85, depth * 0.45);`,

caustics: `
  vec2 p = uv * 5.0;
  float t = u_time * 0.4;
  float a = sin(p.x + t) + sin(p.y * 1.3 - t * 0.8) + sin((p.x + p.y) * 0.8 + t * 0.6);
  float b = sin(p.x * 1.7 - t * 0.7) + sin(p.y * 0.9 + t);
  float m = pow(abs(sin(a * 0.8 + b * 0.4)), 4.0);
  return tint(m, smoothstep(0.5, 1.0, m) * 0.8);`,

ripples: `
  vec2 p = cen(uv);
  float s = 0.0;
  for (int i = 0; i < 3; i++){
    float f = float(i);
    vec2 c = vec2(sin(f * 2.1) * 0.35, cos(f * 1.7) * 0.28);
    s += sin(length(p - c) * 26.0 - u_time * 1.8 + f * 2.0);
  }
  float m = smoothstep(0.4, 2.2, s + 1.5);
  return tint(m * 0.8, 0.0);`,

interference: `
  vec2 p = cen(uv);
  float a = sin(length(p - vec2(0.22, 0.0)) * 60.0 - u_time * 1.2);
  float b = sin(length(p + vec2(0.22, 0.0)) * 60.0 - u_time * 1.2);
  float m = smoothstep(0.6, 1.0, (a * b) * 0.5 + 0.5);
  return tint(m, 0.0);`,

lissajous: `
  vec2 p = cen(uv);
  float m = 0.0;
  for (int i = 0; i < 24; i++){
    float t = float(i) / 24.0 * 6.2831 + u_time * 0.25;
    vec2 q = vec2(sin(t * 3.0) * 0.42, sin(t * 2.0 + u_time * 0.1) * 0.34);
    m = max(m, smoothstep(0.05, 0.0, length(p - q)));
  }
  return tint(m, m * 0.6);`,

rainfall: `
  vec2 g = vec2(uv.x * 50.0, uv.y);
  float col_ = floor(g.x);
  float sp = 0.6 + hash11(col_) * 1.4;
  float y = fract(g.y + u_time * sp * 0.35 + hash11(col_ + 7.0));
  float streak = smoothstep(0.32, 0.0, y) * smoothstep(0.0, 0.03, y);
  return tint(streak * 0.7, 0.0);`,

rain: `
  vec2 g = vec2(uv.x * 42.0, uv.y * 26.0);
  float col_ = floor(g.x);
  float head = fract(hash11(col_) + u_time * (0.25 + hash11(col_ + 3.0) * 0.5));
  float d = fract(g.y) ;
  float cell = floor(g.y) / 26.0;
  float lit = smoothstep(0.30, 0.0, fract(cell - head + 1.0));
  float glyph = step(0.45, hash21(vec2(col_, floor(g.y) + floor(u_time * 6.0))));
  return tint(lit * glyph * 0.9, lit * glyph * step(0.97, fract(cell - head + 1.0)));`,

/* ---- terrain / organic ------------------------------------------------ */
dunes: `
  float m = 0.0;
  for (int i = 0; i < 4; i++){
    float f = float(i);
    float base = 0.18 + f * 0.17;
    float h = base + sin(uv.x * (2.0 + f) + u_time * 0.06 * (1.0 + f)) * 0.055
                   + fbm(vec2(uv.x * 2.0 + f * 3.0, f)) * 0.07;
    m = max(m, step(uv.y, h) * (0.3 + f * 0.2));
  }
  return tint(m, smoothstep(0.65, 1.0, uv.y) * 0.5);`,

contours: `
  float h = fbm(uv * 3.0 + u_time * 0.015);
  float band = abs(fract(h * 16.0) - 0.5);
  float line = smoothstep(0.08, 0.0, band);
  return tint(line * 0.8, smoothstep(0.55, 0.9, h) * 0.4);`,

topo: `
  float h = fbm(uv * 2.2 + vec2(u_time * 0.01, 0.0));
  float band = abs(fract(h * 9.0) - 0.5);
  float line = smoothstep(0.06, 0.0, band);
  float fill = floor(h * 9.0) / 9.0;
  return tint(line * 0.7 + fill * 0.28, fill * 0.5);`,

canopy: `
  float m = 0.0;
  for (int i = 0; i < 3; i++){
    float f = float(i);
    vec2 p = uv * (5.0 + f * 3.0) + vec2(u_time * 0.02 * (f + 1.0), f * 4.0);
    m += step(0.62, fbm(p)) * (0.22 - f * 0.05);
  }
  float light = smoothstep(0.1, 1.0, uv.y);
  return tint(1.0 - m * 2.2, light * 0.5);`,

magma: `
  float f = fbm(uv * 3.4 + vec2(0.0, -u_time * 0.05));
  float crack = smoothstep(0.52, 0.46, abs(f - 0.5));
  float heat = smoothstep(0.30, 0.0, abs(f - 0.5));
  vec3 col = mix(u_bg, u_a1, crack * 0.9);
  return mix(col, u_a2, heat * 0.55 * (0.4 + u_energy));`,

embers: `
  vec3 col = u_bg;
  for (int i = 0; i < 3; i++){
    float f = float(i);
    vec2 g = vec2(uv.x * (16.0 + f * 7.0), uv.y);
    float c = floor(g.x);
    float y = fract(uv.y + u_time * (0.05 + hash11(c + f) * 0.09));
    float d = length(vec2(fract(g.x) - 0.5, (y - 0.5) * 2.2));
    col += (f < 1.5 ? u_a1 : u_a2) * smoothstep(0.22, 0.0, d) * (0.22 - f * 0.05)
         * step(0.70, hash11(c + f * 11.0));
  }
  return col;`,

/* ---- texture / print -------------------------------------------------- */
static: `
  float n = hash21(floor(gl_FragCoord.xy / 2.0) + floor(u_time * 24.0) * 37.0);
  float band = step(0.5, fract(uv.y * 3.0 - u_time * 0.1)) * 0.08;
  return mix(u_bg, u_a1, n * (0.14 + u_energy * 0.14) + band);`,

scanfield: `
  float line = step(0.5, fract(uv.y * u_res.y / 3.0));
  float sweep = smoothstep(0.08, 0.0, abs(fract(uv.y - u_time * 0.12) - 0.5));
  float f = fbm(uv * 2.0 + u_time * 0.02);
  return tint(f * 0.5 + sweep * 0.7, line * 0.10);`,

risograin: `
  float n = hash21(floor(gl_FragCoord.xy / 3.0));
  float f = fbm(uv * 2.6);
  float a = smoothstep(0.42, 0.72, f + n * 0.18);
  float b = smoothstep(0.52, 0.86, fbm(uv * 3.4 + 9.0) + n * 0.16);
  return tint(a * 0.8, b * 0.7);`,

chalkdust: `
  float n = hash21(floor(gl_FragCoord.xy / 2.0)) * 0.5;
  float f = fbm(uv * 4.0 + u_time * 0.01);
  float m = smoothstep(0.40, 0.85, f + n * 0.3);
  return tint(m * 0.45, 0.0);`,

brushed: `
  float n = n2(vec2(uv.x * 420.0, uv.y * 3.0));
  float sheen = 0.5 + 0.5 * sin(uv.x * 2.4 + u_time * 0.12);
  return tint(n * 0.35 + sheen * 0.35, sheen * 0.3);`,

plasma: `
  float f = fbm(uv * 3.0 + vec2(u_time * 0.14, u_time * 0.09));
  float band = step(0.5, fract(f * 3.4 + u_time * 0.1));
  float dither = step(0.5, hash21(floor(uv * u_res / 3.0)));
  float m = clamp(band * 0.72 + dither * 0.28, 0.0, 1.0);
  return mix(u_bg, u_a1, m * (0.30 + u_energy * 0.34));`,

rings: `
  vec2 p = cen(uv);
  float d = length(p);
  float r = sin(d * 22.0 - u_time * 1.7) * 0.5 + 0.5;
  float m = smoothstep(0.62, 1.0, r) * smoothstep(0.85, 0.10, d);
  vec3 col = mix(u_bg, u_a1, m * (0.14 + u_energy * 0.17));
  return mix(col, u_a2, smoothstep(0.62, 0.0, d) * 0.07 * u_energy);`,

/* ---- geometry, part two ---------------------------------------------- */
spiral: `
  vec2 p = cen(uv);
  float a = atan(p.y, p.x), r = length(p);
  float s = fract((a / 6.2831) * 6.0 + r * 7.0 - u_time * 0.3);
  float m = smoothstep(0.46, 0.54, s) * smoothstep(1.1, 0.03, r);
  return tint(m, smoothstep(0.35, 0.0, r) * 0.6);`,

triangles: `
  vec2 p = cen(uv) * 8.0;
  p.x += p.y * 0.5;
  vec2 f = fract(p);
  float up = step(f.x + f.y, 1.0);
  vec2 id = floor(p) + up * 0.3;
  float h = hash21(id);
  float pulse = 0.5 + 0.5 * sin(u_time * 0.8 + h * 20.0);
  return tint(h * 0.5 + pulse * 0.35, up * h * 0.4);`,

diamonds: `
  vec2 p = cen(uv) * 11.0;
  p = rot(0.785) * p;
  vec2 f = abs(fract(p) - 0.5);
  float e = smoothstep(0.42, 0.5, f.x + f.y);
  float pulse = 0.5 + 0.5 * sin(u_time * 1.1 - length(cen(uv)) * 7.0);
  return tint(e * (0.35 + pulse * 0.5), 0.0);`,

scales: `
  vec2 p = uv * vec2(u_res.x / u_res.y, 1.0) * 13.0;
  p.x += mod(floor(p.y), 2.0) * 0.5;
  vec2 f = fract(p) - vec2(0.5, 0.0);
  float d = length(vec2(f.x, f.y * 1.3));
  float e = smoothstep(0.52, 0.46, d) - smoothstep(0.42, 0.36, d);
  return tint(e * 0.8 + smoothstep(0.42, 0.0, d) * 0.22, 0.0);`,

chevron: `
  vec2 p = uv * vec2(u_res.x / u_res.y, 1.0) * 9.0;
  float v = abs(fract(p.x) - 0.5) * 2.0;
  float band = fract(p.y - v * 0.5 + u_time * 0.18);
  float m = step(0.5, band);
  return tint(m * 0.4 + (1.0 - m) * 0.12, 0.0);`,

stripes: `
  vec2 p = rot(0.6) * (uv * vec2(u_res.x / u_res.y, 1.0));
  float s = fract(p.x * 14.0 - u_time * 0.25);
  float m = smoothstep(0.46, 0.5, abs(s - 0.5) * 2.0);
  return tint(m * 0.35, (1.0 - m) * 0.14);`,

ladder: `
  vec2 p = uv - vec2(0.5, 0.0);
  float z = 1.0 / max(1.02 - uv.y, 0.02);
  float rung = smoothstep(0.42, 0.5, abs(fract(z * 0.8 + u_time * 0.5) - 0.5) * 2.0);
  float rail = smoothstep(0.03, 0.0, abs(abs(p.x) - 0.22 * z * 0.25));
  return tint(max(rung * 0.5, rail * 0.8) * smoothstep(1.0, 0.1, uv.y), 0.0);`,

pillars: `
  float x = uv.x * 16.0;
  float id = floor(x);
  float h = 0.25 + hash11(id) * 0.6 + sin(u_time * 0.5 + id) * 0.08;
  float m = step(uv.y, h) * smoothstep(0.5, 0.46, abs(fract(x) - 0.5));
  return tint(m * 0.55, step(uv.y, h * 0.4) * 0.4);`,

mesh: `
  vec2 p = uv * 10.0;
  p.y += fbm(vec2(p.x * 0.3, u_time * 0.08)) * 2.2;
  vec2 f = abs(fract(p) - 0.5);
  float e = smoothstep(0.46, 0.5, max(f.x, f.y));
  return tint(e * 0.6, smoothstep(0.7, 1.0, fbm(uv * 2.0)) * 0.4);`,

terrain: `
  float m = 0.0;
  for (int i = 0; i < 5; i++){
    float f = float(i);
    float h = 0.12 + f * 0.15 + fbm(vec2(uv.x * (3.0 + f) + f * 7.0, f * 2.0 + u_time * 0.02)) * 0.16;
    m = max(m, step(uv.y, h) * (0.22 + f * 0.17));
  }
  return tint(m, smoothstep(0.6, 1.0, uv.y) * 0.45);`,

/* ---- atmosphere ------------------------------------------------------- */
clouds: `
  float f = fbm(uv * vec2(2.4, 3.4) + vec2(u_time * 0.035, 0.0));
  float g = fbm(uv * vec2(4.8, 6.0) - vec2(u_time * 0.02, 0.0) + 5.0);
  float m = smoothstep(0.46, 0.86, f * 0.75 + g * 0.35);
  return tint(m, smoothstep(0.66, 1.0, f) * 0.5);`,

mist: `
  float m = 0.0;
  for (int i = 0; i < 4; i++){
    float f = float(i);
    float y = fract(uv.y * 1.3 + f * 0.25 + u_time * 0.012 * (1.0 + f));
    m += smoothstep(0.5, 0.0, abs(y - 0.5)) * (0.18 - f * 0.03)
       * (0.6 + fbm(vec2(uv.x * 3.0 + f, f)) * 0.8);
  }
  return tint(m * 1.6, 0.0);`,

shimmer: `
  float x = uv.x * 10.0;
  float band = sin(x + fbm(vec2(x * 0.4, u_time * 0.14)) * 4.0 + u_time * 0.3);
  float m = smoothstep(0.2, 1.0, band) * smoothstep(0.0, 0.8, uv.y);
  return tint(m * 0.8, smoothstep(0.6, 1.0, m) * 0.6);`,

prism: `
  vec2 p = cen(uv);
  float a = atan(p.y, p.x) / 6.2831 + 0.5;
  float band = fract(a * 6.0 + u_time * 0.08);
  float m = smoothstep(0.1, 0.5, band) * smoothstep(1.2, 0.1, length(p));
  return tint(m * 0.6, (1.0 - band) * 0.4 * smoothstep(1.0, 0.0, length(p)));`,

bands: `
  float y = uv.y * 7.0 + fbm(vec2(uv.x * 2.0, u_time * 0.03)) * 1.4;
  float k = floor(y) / 7.0;
  return tint(k * 0.7, (1.0 - k) * 0.4);`,

sonar: `
  vec2 p = cen(uv);
  float d = length(p);
  float t = fract(u_time * 0.35);
  float ring = smoothstep(0.03, 0.0, abs(d - t * 1.2));
  float ring2 = smoothstep(0.03, 0.0, abs(d - fract(t + 0.5) * 1.2));
  float sweep = smoothstep(0.0, 0.6, 1.0 - abs(fract(atan(p.y, p.x) / 6.2831 - u_time * 0.12) - 0.0));
  return tint(max(ring, ring2) * 0.9 + sweep * 0.12, 0.0);`,

/* ---- material --------------------------------------------------------- */
paper: `
  float f = n2(gl_FragCoord.xy * 0.35) * 0.5 + n2(gl_FragCoord.xy * 0.08) * 0.5;
  float fibre = n2(vec2(gl_FragCoord.x * 0.02, gl_FragCoord.y * 0.6));
  return tint(f * 0.22 + fibre * 0.16, 0.0);`,

concrete: `
  float f = fbm(uv * 8.0) * 0.6 + hash21(floor(gl_FragCoord.xy / 2.0)) * 0.4;
  float blotch = smoothstep(0.55, 0.85, fbm(uv * 3.0 + 4.0));
  return tint(f * 0.3 + blotch * 0.25, 0.0);`,

marble: `
  vec2 p = uv * 3.0;
  float v = fbm(p + fbm(p * 2.0 + u_time * 0.01) * 3.0);
  float vein = smoothstep(0.04, 0.0, abs(fract(v * 4.0) - 0.5) - 0.42);
  return tint(vein * 0.85 + v * 0.18, 0.0);`,

wood: `
  vec2 p = uv * vec2(1.6, 7.0);
  float rings = fract(length(p - vec2(0.4, 0.0)) * 3.0 + fbm(p * 1.4) * 1.8);
  float grain = n2(vec2(uv.x * 220.0, uv.y * 4.0));
  return tint(smoothstep(0.35, 0.65, rings) * 0.45 + grain * 0.14, 0.0);`,

carbon: `
  vec2 g = uv * vec2(u_res.x / u_res.y, 1.0) * 46.0;
  vec2 id = floor(g); vec2 f = fract(g);
  float weave = mod(id.x + id.y, 2.0) < 1.0
    ? smoothstep(0.5, 0.0, abs(f.y - 0.5))
    : smoothstep(0.5, 0.0, abs(f.x - 0.5));
  float sheen = 0.5 + 0.5 * sin(uv.x * 3.0 + uv.y * 2.0 + u_time * 0.2);

denim: `
  vec2 g = uv * vec2(u_res.x / u_res.y, 1.0) * 180.0;
  float twill = step(0.5, fract((g.x + g.y * 2.0) / 3.0));
  float slub = n2(vec2(g.x * 0.08, g.y * 0.02));
  return tint(twill * 0.18 + slub * 0.22, 0.0);`,

crosshatch: `
  vec2 g = uv * vec2(u_res.x / u_res.y, 1.0) * 40.0;
  float v = fbm(uv * 2.4 + u_time * 0.02);
  float a = smoothstep(0.48, 0.5, abs(fract((rot(0.7) * g).x) - 0.5));
  float b = smoothstep(0.48, 0.5, abs(fract((rot(-0.7) * g).x) - 0.5));
  float ink = (v > 0.55 ? a : 0.0) + (v > 0.68 ? b : 0.0);
  return tint(clamp(ink, 0.0, 1.0) * 0.55, 0.0);`,

engraving: `
  float v = fbm(uv * 2.6 + u_time * 0.015);
  float line = abs(fract(uv.y * 90.0 + v * 6.0) - 0.5) * 2.0;
  float ink = smoothstep(v * 0.9, v * 0.9 - 0.25, line);
  return tint(ink * 0.5, 0.0);`,

stipple: `
  vec2 g = uv * vec2(u_res.x / u_res.y, 1.0) * 90.0;
  vec2 id = floor(g);
  float v = fbm(uv * 2.6);
  float r = hash21(id);
  float dot_ = step(r, v * 0.9) * smoothstep(0.42, 0.1, length(fract(g) - 0.5));
  return tint(dot_ * 0.6, 0.0);`,

tartan: `
  vec2 p = uv * vec2(u_res.x / u_res.y, 1.0) * 7.0;
  float a = step(0.5, fract(p.x)) + step(0.82, fract(p.x * 2.0));
  float b = step(0.5, fract(p.y)) + step(0.82, fract(p.y * 2.0));
  return tint(a * 0.22, b * 0.22);`,

/* ---- signal / screen --------------------------------------------------- */
bubbles: `
  vec3 col = u_bg;
  for (int i = 0; i < 4; i++){
    float f = float(i);
    vec2 g = vec2(uv.x * (7.0 + f * 4.0), uv.y);
    float c = floor(g.x);
    float y = fract(uv.y + u_time * (0.03 + hash11(c + f) * 0.06));
    float d = length(vec2(fract(g.x) - 0.5, (y - 0.5) * 1.4)) ;
    float ring = smoothstep(0.34, 0.30, d) - smoothstep(0.28, 0.24, d);
    col += u_a2 * ring * (0.5 - f * 0.08) * step(0.55, hash11(c + f * 9.0));
  }
  return col;`,

firefly: `
  vec3 col = u_bg;
  for (int i = 0; i < 3; i++){
    float f = float(i);
    vec2 g = uv * (9.0 + f * 5.0);
    vec2 id = floor(g);
    vec2 o = hash22(id + f * 17.0);
    vec2 pos = 0.5 + 0.38 * sin(u_time * (0.4 + o.x * 0.6) + o * 6.28);
    float d = length(fract(g) - pos);
    float tw = 0.4 + 0.6 * sin(u_time * (1.2 + o.y * 2.0) + o.x * 20.0);
    col += u_a1 * smoothstep(0.17, 0.0, d) * tw * (0.5 - f * 0.12)
         * step(0.80, hash21(id + f * 5.0));
  }
  return col;`,

lcd: `
  vec2 g = gl_FragCoord.xy / 3.0;
  float sub = mod(floor(g.x), 3.0);
  float cell = smoothstep(0.5, 0.0, abs(fract(g.y) - 0.5));
  float f = fbm(uv * 2.4 + u_time * 0.03);
  vec3 mask = vec3(step(sub, 0.5), step(abs(sub - 1.0), 0.5), step(1.5, sub));
  return mix(u_bg, u_a1 * mask * 3.0, f * cell * (0.10 + u_energy * 0.12));`,

crtbed: `
  vec2 p = cen(uv);
  // Barrel distortion, so the scanlines sit on a curved tube.
  vec2 q = p * (1.0 + 0.16 * dot(p, p));
  vec2 uv2 = q + 0.5;
  float inside = step(0.0, uv2.x) * step(uv2.x, 1.0) * step(0.0, uv2.y) * step(uv2.y, 1.0);
  float f = fbm(uv2 * 2.2 + u_time * 0.05);
  float line = 0.5 + 0.5 * sin(uv2.y * u_res.y * 0.9);
  float glow = smoothstep(1.0, 0.0, length(p));

datamosh: `
  vec2 g = floor(uv * vec2(28.0, 16.0));
  float h = hash21(g + floor(u_time * 3.0));
  vec2 off = (h > 0.86) ? vec2(h - 0.5, 0.0) * 0.12 : vec2(0.0);
  float f = fbm((uv + off) * 3.0);
  float block = step(0.92, h);
  return tint(f * 0.6 + block * 0.5, block * 0.8);`,

rgbsplit: `
  float f = fbm(uv * 2.6 + u_time * 0.05);
  float j = step(0.93, hash11(floor(u_time * 8.0))) * 0.02;
  float r = fbm((uv + vec2(j, 0.0)) * 2.6 + u_time * 0.05);
  float b = fbm((uv - vec2(j, 0.0)) * 2.6 + u_time * 0.05);
  vec3 col = u_bg;
  col = mix(col, u_a1, smoothstep(0.4, 0.9, r) * 0.45);
  col = mix(col, u_a2, smoothstep(0.4, 0.9, b) * 0.35);

};

/* --- program cache ----------------------------------------------------- */

function compileShader(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.warn('bed shader:', gl.getShaderInfoLog(s));
    gl.deleteShader(s);
    return null;
  }
  return s;
}

/**
 * Build (and cache) the program for one bed. Only the beds a film actually
 * uses are ever compiled.
 */
function bedProgram(gl, mode) {
  if (!S.progs) S.progs = {};
  if (S.progs[mode]) return S.progs[mode];

  const body = BEDS[mode] || BEDS.aurora;
  const frag = GL_PRELUDE + '\nvec3 bed(vec2 uv){\n' + body + '\n}\n' + GL_MAIN;
  const vs = compileShader(gl, gl.VERTEX_SHADER, VERT);
  const fs = compileShader(gl, gl.FRAGMENT_SHADER, frag);
  if (!vs || !fs) {
    // A broken bed must never take the whole film down: fall back to aurora,
    // which is the one bed guaranteed to compile.
    S.progs[mode] = mode === 'aurora' ? null : bedProgram(gl, 'aurora');
    return S.progs[mode];
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, 'p');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.warn('bed link:', gl.getProgramInfoLog(prog));
    S.progs[mode] = mode === 'aurora' ? null : bedProgram(gl, 'aurora');
    return S.progs[mode];
  }
  const u = {};
  for (const n of ['u_res', 'u_time', 'u_energy', 'u_seed', 'u_bg', 'u_a1', 'u_a2'])
    u[n] = gl.getUniformLocation(prog, n);
  S.progs[mode] = { prog, u };
  return S.progs[mode];
}

function initGL(canvas) {
  const gl = canvas.getContext('webgl', {
    antialias: false, preserveDrawingBuffer: true, alpha: false, depth: false,
  });
  if (!gl) return null;
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  S.progs = {};
  return gl;
}

/**
 * The shader bed renders at a fraction of the stage and is upscaled by the
 * compositor. Under software WebGL a full 1920x1080 field is by far the most
 * expensive thing per frame, and the bed is a soft gradient -- the resample
 * is not visible, the saving is roughly 4x.
 */
const BG_SCALE = 0.5;

/** Every bed name the engine knows, for the catalogue and the self-test. */
const BED_NAMES = Object.keys(BEDS);

function drawGL(mode, energy, t) {
  const gl = S.gl;
  if (!gl) return;
  const p = bedProgram(gl, mode in BEDS ? mode : 'aurora');
  if (!p) return;
  const th = S.theme;
  gl.useProgram(p.prog);
  gl.viewport(0, 0, S.BW, S.BH);
  gl.uniform2f(p.u.u_res, S.BW, S.BH);
  gl.uniform1f(p.u.u_time, t);
  gl.uniform1f(p.u.u_energy, energy);
  gl.uniform1f(p.u.u_seed, (S.spec.seed % 1000) / 7.3);
  const c = x => { const v = hex2rgb(x); return [v[0] / 255, v[1] / 255, v[2] / 255]; };
  gl.uniform3fv(p.u.u_bg, c(th.bg));
  gl.uniform3fv(p.u.u_a1, c(th.accent));
  gl.uniform3fv(p.u.u_a2, c(th.accent2));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* =======================================================================
   2D effects layer
   -----------------------------------------------------------------------
   Everything the shader bed cannot do cheaply: geometry with real structure,
   particles with individual histories, and overlays that have to sit *above*
   the typography rather than behind it.

   Every layer is a pure function of (t, progress). None of them accumulate
   state between frames, because the renderer calls seek(t) out of order and
   anything that integrates would desynchronise from its own seed.
   ======================================================================= */

function seedFx() {
  const r = rng(S.spec.seed || 1);
  S.rndA = Array.from({ length: 512 }, r);        // a reusable deterministic tape

  S.motes = Array.from({ length: 150 }, () => ({
    x: r(), y: r(), z: 0.25 + r() * 0.75, s: 0.6 + r() * 2.4,
    vx: (r() - 0.5) * 0.020, vy: -0.012 - r() * 0.035, ph: r() * 6.28,
  }));

  // Globe: points on a Fibonacci sphere, kept only over "landmass" noise so
  // the dots read as continents rather than a uniform shell.
  S.globePts = [];
  const N = 1500, GA = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const rad = Math.sqrt(Math.max(0, 1 - y * y));
    const th = GA * i;
    const x = Math.cos(th) * rad, z = Math.sin(th) * rad;
    const n = (Math.sin(x * 4.1 + 1.3) * Math.cos(z * 3.7 - 0.8) +
               Math.sin(y * 5.2) * 0.7 + Math.cos(x * 7.9 + z * 6.1) * 0.45);
    if (n > 0.18) S.globePts.push([x, y, z]);
  }
  S.arcs = Array.from({ length: 11 }, () => {
    const pick = () => {
      const u = r() * 2 - 1, a = r() * Math.PI * 2, rad = Math.sqrt(1 - u * u);
      return [Math.cos(a) * rad, u, Math.sin(a) * rad];
    };
    return { a: pick(), b: pick(), off: r(), spd: 0.35 + r() * 0.5 };
  });

  // A generic particle pool the lighter layers share, so adding a layer does
  // not mean another 200-object allocation at load.
  S.pool = Array.from({ length: 220 }, () => ({
    x: r(), y: r(), z: 0.2 + r() * 0.8, s: r(), ph: r() * 6.28,
    a: r() * 6.28, v: 0.3 + r() * 1.4,
  }));
}

function fxClear() {
  S.fxCtx.setTransform(1, 0, 0, 1, 0, 0);
  S.fxCtx.clearRect(0, 0, S.W, S.H);
}

/** Rotating wireframe globe with animated great-circle arcs. */
function drawGlobe(t, cx, cy, R, p, color, accent2) {
  const c = S.fxCtx;
  const rot = t * 0.26, tilt = -0.42;
  const cosR = Math.cos(rot), sinR = Math.sin(rot);
  const cosT = Math.cos(tilt), sinT = Math.sin(tilt);

  const proj = ([x, y, z]) => {
    let X = x * cosR - z * sinR, Z = x * sinR + z * cosR;
    let Y = y * cosT - Z * sinT; Z = y * sinT + Z * cosT;
    return [cx + X * R, cy + Y * R, Z];
  };

  const g = c.createRadialGradient(cx, cy, R * 0.70, cx, cy, R * 1.30);
  g.addColorStop(0, rgba(accent2, 0.00));
  g.addColorStop(0.72, rgba(accent2, 0.17 * p));
  g.addColorStop(1, rgba(accent2, 0));
  c.fillStyle = g;
  c.beginPath(); c.arc(cx, cy, R * 1.30, 0, 6.2832); c.fill();

  const reveal = clamp(p * 1.25);
  for (let i = 0; i < S.globePts.length; i++) {
    if (i / S.globePts.length > reveal) break;
    const [X, Y, Z] = proj(S.globePts[i]);
    if (Z < -0.08) continue;
    const d = clamp((Z + 0.1) / 1.1);
    c.globalAlpha = (0.16 + d * 0.72) * p;
    c.fillStyle = color;
    const s = (0.9 + d * 1.5) * (R / 420);
    c.fillRect(X - s, Y - s, s * 2, s * 2);
  }
  c.globalAlpha = 1;

  c.strokeStyle = rgba(accent2, 0.5 * p);
  c.lineWidth = 2 * (R / 420);
  c.beginPath(); c.arc(cx, cy, R, 0, 6.2832); c.stroke();

  for (const a of S.arcs) {
    const prog = clamp(((t * a.spd + a.off) % 1.45) / 1.0);
    if (prog <= 0.001) continue;
    c.beginPath();
    let started = false;
    const STEPS = 46;
    for (let i = 0; i <= STEPS; i++) {
      const u = i / STEPS;
      if (u > prog) break;
      const dot = clamp(a.a[0]*a.b[0] + a.a[1]*a.b[1] + a.a[2]*a.b[2], -1, 1);
      const om = Math.acos(dot) || 1e-4, so = Math.sin(om);
      const k1 = Math.sin((1 - u) * om) / so, k2 = Math.sin(u * om) / so;
      const lift = 1 + 0.30 * Math.sin(u * Math.PI);
      const [X, Y, Z] = proj([(a.a[0]*k1 + a.b[0]*k2) * lift,
                              (a.a[1]*k1 + a.b[1]*k2) * lift,
                              (a.a[2]*k1 + a.b[2]*k2) * lift]);
      if (Z < -0.45) { started = false; continue; }
      if (!started) { c.moveTo(X, Y); started = true; } else c.lineTo(X, Y);
    }
    c.strokeStyle = rgba(S.theme.accent, 0.78 * p);
    c.lineWidth = 2.4 * (R / 420);
    c.shadowColor = rgba(S.theme.accent, 0.85); c.shadowBlur = 16 * (R / 420);
    c.stroke();
    c.shadowBlur = 0;
  }
}

/* =======================================================================
   The overlay library
   -----------------------------------------------------------------------
   Each entry is fx(ctx, t, p, th, W, H), where `p` is the shot's own 0..1
   entrance progress so layers can build in with their shot.
   ======================================================================= */

const FX = {

/* ---- particulate ------------------------------------------------------ */
motes(c, t, p, th, W, H) {
  for (const m of S.motes) {
    const x = ((m.x + m.vx * t) % 1 + 1) % 1;
    const y = ((m.y + m.vy * t) % 1 + 1) % 1;
    const tw = 0.42 + 0.58 * Math.sin(t * 1.4 + m.ph);
    c.globalAlpha = clamp(m.z * 0.46 * tw * p);
    c.fillStyle = th.fg;
    c.beginPath(); c.arc(x * W, y * H, m.s * m.z * (W / 1920), 0, 6.2832); c.fill();
  }
  c.globalAlpha = 1;
},

snow(c, t, p, th, W, H) {
  for (let i = 0; i < 160; i++) {
    const o = S.pool[i];
    const drift = Math.sin(t * 0.6 + o.ph) * 0.03;
    const x = ((o.x + drift) % 1 + 1) % 1;
    const y = ((o.y + t * 0.035 * o.v) % 1 + 1) % 1;
    c.globalAlpha = o.z * 0.5 * p;
    c.fillStyle = th.fg;
    c.beginPath(); c.arc(x * W, y * H, (0.8 + o.s * 2.2) * o.z * (W / 1920), 0, 6.2832); c.fill();
  }
  c.globalAlpha = 1;
},

sparks(c, t, p, th, W, H) {
  for (let i = 0; i < 90; i++) {
    const o = S.pool[i + 20];
    const y = 1 - ((o.y + t * 0.09 * o.v) % 1);
    const x = ((o.x + Math.sin(t * 0.8 + o.ph) * 0.02) % 1 + 1) % 1;
    const fade = y;                       // dimmer as it rises
    c.globalAlpha = clamp(o.z * 0.9 * fade * p);
    c.fillStyle = i % 3 ? th.accent : th.accent2;
    const s = (0.8 + o.s * 1.8) * (W / 1920);
    c.fillRect(x * W, y * H, s, s * 3);
  }
  c.globalAlpha = 1;
},

confetti(c, t, p, th, W, H) {
  for (let i = 0; i < 110; i++) {
    const o = S.pool[i + 40];
    const y = ((o.y + t * 0.07 * o.v) % 1 + 1) % 1;
    const x = ((o.x + Math.sin(t * 1.1 + o.ph) * 0.04) % 1 + 1) % 1;
    const rot = t * (1 + o.s * 3) + o.ph;
    c.save();
    c.translate(x * W, y * H);
    c.rotate(rot);
    c.globalAlpha = 0.75 * p * o.z;
    c.fillStyle = [th.accent, th.accent2, th.fg][i % 3];
    const w = (5 + o.s * 7) * (W / 1920);
    c.fillRect(-w / 2, -w / 4, w, w / 2);
    c.restore();
  }
  c.globalAlpha = 1;
},

bokeh(c, t, p, th, W, H) {
  for (let i = 0; i < 26; i++) {
    const o = S.pool[i + 70];
    const x = ((o.x + Math.sin(t * 0.14 + o.ph) * 0.05) % 1 + 1) % 1;
    const y = ((o.y + Math.cos(t * 0.11 + o.ph) * 0.04) % 1 + 1) % 1;
    const R = (24 + o.s * 72) * (W / 1920);
    const g = c.createRadialGradient(x * W, y * H, 0, x * W, y * H, R);
    const col = i % 2 ? th.accent : th.accent2;
    g.addColorStop(0, rgba(col, 0.15 * o.z * p));
    g.addColorStop(0.75, rgba(col, 0.05 * o.z * p));
    g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g;
    c.beginPath(); c.arc(x * W, y * H, R, 0, 6.2832); c.fill();
  }
},

orbits(c, t, p, th, W, H) {
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < 5; i++) {
    const R = (0.16 + i * 0.075) * Math.min(W, H);
    c.globalAlpha = 0.14 * p;
    c.strokeStyle = th.fg; c.lineWidth = 1;
    c.beginPath(); c.ellipse(cx, cy, R, R * 0.42, i * 0.5, 0, 6.2832); c.stroke();
    const a = t * (0.5 - i * 0.06) + i * 1.7;
    const px = cx + Math.cos(a) * R * Math.cos(i * 0.5) - Math.sin(a) * R * 0.42 * Math.sin(i * 0.5);
    const py = cy + Math.cos(a) * R * Math.sin(i * 0.5) + Math.sin(a) * R * 0.42 * Math.cos(i * 0.5);
    c.globalAlpha = 0.85 * p;
    c.fillStyle = th.accent;
    c.beginPath(); c.arc(px, py, 4 * (W / 1920) + 2, 0, 6.2832); c.fill();
  }
  c.globalAlpha = 1;
},

network(c, t, p, th, W, H) {
  const n = 22;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const o = S.pool[i + 100];
    pts.push([(((o.x + Math.sin(t * 0.18 + o.ph) * 0.045) % 1) + 1) % 1 * W,
              (((o.y + Math.cos(t * 0.15 + o.ph) * 0.04) % 1) + 1) % 1 * H]);
  }
  c.lineWidth = 1;
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1];
      const d = Math.hypot(dx, dy);
      const lim = W * 0.16;
      if (d > lim) continue;
      c.globalAlpha = (1 - d / lim) * 0.30 * p;
      c.strokeStyle = th.accent;
      c.beginPath(); c.moveTo(pts[i][0], pts[i][1]); c.lineTo(pts[j][0], pts[j][1]); c.stroke();
    }
  }
  c.globalAlpha = 0.7 * p;
  c.fillStyle = th.fg;
  for (const q of pts) { c.beginPath(); c.arc(q[0], q[1], 2.4 * (W / 1920) + 1, 0, 6.2832); c.fill(); }
  c.globalAlpha = 1;
},

/* ---- weather ---------------------------------------------------------- */
rain(c, t, p, th, W, H) {
  c.lineWidth = 1.2 * (W / 1920);
  c.strokeStyle = rgba(th.fg, 0.22 * p);
  for (let i = 0; i < 130; i++) {
    const o = S.pool[i + 10];
    const x = ((o.x + t * 0.012) % 1 + 1) % 1 * W;
    const y = ((o.y + t * 0.55 * o.v) % 1 + 1) % 1 * H;
    const len = (18 + o.s * 30) * (H / 1080);
    c.beginPath(); c.moveTo(x, y); c.lineTo(x - len * 0.18, y + len); c.stroke();
  }
},

streaks(c, t, p, th, W, H) {
  for (let i = 0; i < 40; i++) {
    const o = S.pool[i + 130];
    const y = o.y * H;
    const x = ((o.x + t * 0.25 * o.v) % 1.3 - 0.15) * W;
    const len = (60 + o.s * 240) * (W / 1920);
    const g = c.createLinearGradient(x, y, x + len, y);
    g.addColorStop(0, rgba(th.accent, 0));
    g.addColorStop(0.5, rgba(th.accent, 0.30 * o.z * p));
    g.addColorStop(1, rgba(th.accent, 0));
    c.fillStyle = g;
    c.fillRect(x, y, len, Math.max(1, 1.6 * o.z * (H / 1080)));
  }
},

/* ---- technical / HUD --------------------------------------------------- */
grid(c, t, p, th, W, H) {
  const cell = 56 * (H / 1080);
  c.globalAlpha = 0.10 * p;
  c.strokeStyle = th.fg; c.lineWidth = 1;
  c.beginPath();
  const n = Math.ceil(W / cell) * clamp(p * 1.4);
  for (let i = 0; i <= n; i++) { const x = i * cell; c.moveTo(x, 0); c.lineTo(x, H); }
  for (let y = 0; y <= H; y += cell) { c.moveTo(0, y); c.lineTo(W * clamp(p * 1.4), y); }
  c.stroke();
  c.globalAlpha = 1;
},

crosshair(c, t, p, th, W, H) {
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) * 0.30 * (0.9 + 0.04 * Math.sin(t * 1.3));
  c.globalAlpha = 0.34 * p;
  c.strokeStyle = th.accent; c.lineWidth = 1.4 * (W / 1920);
  c.beginPath(); c.arc(cx, cy, R, 0, 6.2832); c.stroke();
  const gap = R * 0.18;
  c.beginPath();
  c.moveTo(cx - R - gap, cy); c.lineTo(cx - gap, cy);
  c.moveTo(cx + gap, cy); c.lineTo(cx + R + gap, cy);
  c.moveTo(cx, cy - R - gap); c.lineTo(cx, cy - gap);
  c.moveTo(cx, cy + gap); c.lineTo(cx, cy + R + gap);
  c.stroke();
  c.globalAlpha = 1;
},

corners(c, t, p, th, W, H) {
  const m = 42 * (H / 1080), L = 34 * (H / 1080) * clamp(p * 1.3);
  c.globalAlpha = 0.45 * p;
  c.strokeStyle = th.fg; c.lineWidth = 2 * (H / 1080);
  const corner = (x, y, dx, dy) => {
    c.beginPath();
    c.moveTo(x + dx * L, y); c.lineTo(x, y); c.lineTo(x, y + dy * L);
    c.stroke();
  };
  corner(m, m, 1, 1); corner(W - m, m, -1, 1);
  corner(m, H - m, 1, -1); corner(W - m, H - m, -1, -1);
  c.globalAlpha = 1;
},

hud(c, t, p, th, W, H) {
  const m = 56 * (H / 1080);
  c.globalAlpha = 0.30 * p;
  c.strokeStyle = th.fg; c.lineWidth = 1;
  c.strokeRect(m, m, W - m * 2, H - m * 2);
  c.beginPath();
  for (let i = 0; i <= 20; i++) {
    const x = m + (W - m * 2) * (i / 20);
    const h = (i % 5 === 0 ? 14 : 7) * (H / 1080);
    c.moveTo(x, m); c.lineTo(x, m + h);
    c.moveTo(x, H - m); c.lineTo(x, H - m - h);
  }
  c.stroke();
  c.globalAlpha = 1;
},

radar(c, t, p, th, W, H) {
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.42;
  c.globalAlpha = 0.18 * p;
  c.strokeStyle = th.fg; c.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    c.beginPath(); c.arc(cx, cy, R * i / 3, 0, 6.2832); c.stroke();
  }
  const a = t * 0.9;
  const g = c.createConicGradient ? null : null;   // keep to 2D basics
  c.globalAlpha = 0.5 * p;
  c.strokeStyle = th.accent; c.lineWidth = 2 * (W / 1920);
  c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); c.stroke();
  // Fading trail behind the sweep.
  for (let i = 1; i < 14; i++) {
    c.globalAlpha = (0.5 - i * 0.035) * p;
    const aa = a - i * 0.05;
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(aa) * R, cy + Math.sin(aa) * R); c.stroke();
  }
  c.globalAlpha = 1;
},

ticks(c, t, p, th, W, H) {
  c.globalAlpha = 0.4 * p;
  c.fillStyle = th.accent;
  const n = 48;
  for (let i = 0; i < n; i++) {
    const x = (i / n) * W;
    const on = ((i + Math.floor(t * 6)) % 7) === 0;
    const h = (on ? 16 : 7) * (H / 1080);
    c.fillRect(x, H - h - 20 * (H / 1080), 2 * (W / 1920), h);
  }
  c.globalAlpha = 1;
},

/* ---- signal ------------------------------------------------------------ */
wave(c, t, p, th, W, H) {
  const bars = 72, bw = W / bars, baseline = H * 0.90;
  const r = rng(991);
  c.globalAlpha = 0.5 * p;
  for (let i = 0; i < bars * clamp(p * 1.3); i++) {
    const ph = r() * 6.28;
    const h = (0.25 + 0.75 * Math.abs(Math.sin(t * 3.1 + i * 0.31 + ph))) * 96 * p * (H / 1080);
    c.fillStyle = th.accent;
    c.fillRect(i * bw + bw * 0.22, baseline - h, bw * 0.56, h);
  }
  c.globalAlpha = 1;
},

spectrum(c, t, p, th, W, H) {
  const bars = 40, bw = W / bars;
  for (let i = 0; i < bars; i++) {
    const k = i / bars;
    const h = (0.1 + 0.9 * Math.pow(Math.abs(Math.sin(t * 2.2 + k * 9)), 2)) *
              (1 - k * 0.55) * H * 0.22 * p;
    const g = c.createLinearGradient(0, H, 0, H - h);
    g.addColorStop(0, rgba(th.accent, 0.55 * p));
    g.addColorStop(1, rgba(th.accent2, 0.0));
    c.fillStyle = g;
    c.fillRect(i * bw + bw * 0.15, H - h, bw * 0.7, h);
  }
},

waveform(c, t, p, th, W, H) {
  c.strokeStyle = rgba(th.accent, 0.65 * p);
  c.lineWidth = 2.2 * (W / 1920);
  c.beginPath();
  const mid = H * 0.5;
  for (let x = 0; x <= W; x += 6) {
    const k = x / W;
    const y = mid + Math.sin(k * 24 + t * 2.4) * Math.sin(k * 5 - t) * H * 0.07 * p;
    x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
  }
  c.stroke();
},

pulse(c, t, p, th, W, H) {
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < 4; i++) {
    const k = ((t * 0.4 + i / 4) % 1);
    const R = k * Math.min(W, H) * 0.75;
    c.globalAlpha = (1 - k) * 0.30 * p;
    c.strokeStyle = th.accent;
    c.lineWidth = 2.4 * (W / 1920);
    c.beginPath(); c.arc(cx, cy, R, 0, 6.2832); c.stroke();
  }
  c.globalAlpha = 1;
},

/* ---- film / lens ------------------------------------------------------- */
perfs(c, t, p, th, W, H) {
  const hole = 26 * (H / 1080), gap = 52 * (H / 1080);
  c.globalAlpha = 0.5 * p;
  c.fillStyle = th.fg;
  const off = (t * 60 * (H / 1080)) % gap;
  for (let y = -gap + off; y < H + gap; y += gap) {
    c.fillRect(12 * (H / 1080), y, hole * 0.7, hole);
    c.fillRect(W - 12 * (H / 1080) - hole * 0.7, y, hole * 0.7, hole);
  }
  c.globalAlpha = 1;
},

lightleak(c, t, p, th, W, H) {
  const k = 0.5 + 0.5 * Math.sin(t * 0.35);
  const g = c.createLinearGradient(W * (0.6 + k * 0.3), 0, W, H);
  g.addColorStop(0, rgba(th.accent, 0));
  g.addColorStop(0.6, rgba(th.accent, 0.10 * p));
  g.addColorStop(1, rgba(th.accent2, 0.18 * p));
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
},

lens(c, t, p, th, W, H) {
  const sx = W * (0.5 + 0.28 * Math.sin(t * 0.3));
  const sy = H * 0.30;
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < 6; i++) {
    const k = (i - 2) * 0.42;
    const x = cx + (sx - cx) * k, y = cy + (sy - cy) * k;
    const R = (18 + i * 26) * (W / 1920);
    c.globalAlpha = 0.11 * p;
    c.fillStyle = i % 2 ? th.accent : th.accent2;
    c.beginPath(); c.arc(x, y, R, 0, 6.2832); c.fill();
  }
  c.globalAlpha = 1;
},

scanbar(c, t, p, th, W, H) {
  const y = ((t * 0.22) % 1) * H;
  const h = H * 0.10;
  const g = c.createLinearGradient(0, y - h, 0, y + h);
  g.addColorStop(0, rgba(th.accent, 0));
  g.addColorStop(0.5, rgba(th.accent, 0.13 * p));
  g.addColorStop(1, rgba(th.accent, 0));
  c.fillStyle = g;
  c.fillRect(0, y - h, W, h * 2);
},

speckle(c, t, p, th, W, H) {
  const r = rng(Math.floor(t * 20) + 3);
  c.globalAlpha = 0.16 * p;
  c.fillStyle = th.fg;
  for (let i = 0; i < 220; i++) {
    c.fillRect(r() * W, r() * H, 2, 2);
  }
  c.globalAlpha = 1;
},

/* ---- type / motion ----------------------------------------------------- */
matrix(c, t, p, th, W, H) {
  const cols = 46, cw = W / cols;
  c.font = `${Math.round(16 * (H / 1080) * 1.4)}px ui-monospace, monospace`;
  c.textBaseline = 'top';
  for (let i = 0; i < cols; i++) {
    const o = S.pool[(i * 3) % S.pool.length];
    const head = ((o.y + t * 0.18 * o.v) % 1) * H;
    for (let k = 0; k < 10; k++) {
      const y = head - k * 20 * (H / 1080);
      if (y < -20 || y > H) continue;
      c.globalAlpha = (1 - k / 10) * 0.55 * p;
      c.fillStyle = k === 0 ? th.fg : th.accent;
      const ch = String.fromCharCode(0x30 + Math.floor(
        (S.rndA[(i * 7 + k * 13 + Math.floor(t * 8)) % S.rndA.length]) * 42));
      c.fillText(ch, i * cw, y);
    }
  }
  c.globalAlpha = 1;
},

ticker(c, t, p, th, W, H) {
  const txt = '  •  ANALYZE  •  SCORE  •  COMPOSE  •  RENDER';
  c.font = `${Math.round(15 * (H / 1080) * 1.3)}px ui-monospace, monospace`;
  c.textBaseline = 'middle';
  c.globalAlpha = 0.34 * p;
  c.fillStyle = th.fg;
  const w = c.measureText(txt).width || 400;
  let x = -((t * 70 * (W / 1920)) % w);
  while (x < W) { c.fillText(txt, x, H - 34 * (H / 1080)); x += w; }
  c.globalAlpha = 1;
},

bars(c, t, p, th, W, H) {
  const n = 9, m = 44 * (H / 1080);
  c.globalAlpha = 0.5 * p;
  for (let i = 0; i < n; i++) {
    const k = i / n;
    const lenK = 0.3 + 0.7 * Math.abs(Math.sin(t * 1.4 + i * 0.7));
    const h = H * 0.035;
    const y = H * 0.22 + i * (H * 0.56 / n);
    c.fillStyle = i % 2 ? th.accent : th.accent2;
    c.fillRect(m, y, W * 0.035 * lenK, h * 0.3);
    c.fillRect(W - m - W * 0.035 * lenK, y, W * 0.035 * lenK, h * 0.3);
  }
  c.globalAlpha = 1;
},


/* ---- library, part two ------------------------------------------------- */
dust(c, t, p, th, W, H) {
  for (let i = 0; i < 190; i++) {
    const o = S.pool[i % S.pool.length];
    const x = ((o.x + Math.sin(t * 0.21 + o.ph) * 0.06) % 1 + 1) % 1;
    const y = ((o.y - t * 0.008 * o.v) % 1 + 1) % 1;
    c.globalAlpha = o.z * 0.20 * p * (0.4 + 0.6 * Math.sin(t + o.ph));
    c.fillStyle = th.fg;
    c.fillRect(x * W, y * H, 1.6 * (W / 1920) + 0.6, 1.6 * (W / 1920) + 0.6);
  }
  c.globalAlpha = 1;
},

fireflies(c, t, p, th, W, H) {
  for (let i = 0; i < 34; i++) {
    const o = S.pool[i + 150];
    const x = (0.5 + Math.sin(t * 0.33 * o.v + o.ph) * 0.42) * W;
    const y = (0.5 + Math.cos(t * 0.27 * o.v + o.ph * 1.7) * 0.36) * H;
    const tw = Math.pow(0.5 + 0.5 * Math.sin(t * 2.1 + o.ph * 6), 2.4);
    const R = (10 + o.s * 16) * (W / 1920);
    const g = c.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, rgba(th.accent, 0.8 * tw * p));
    g.addColorStop(1, rgba(th.accent, 0));
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, R, 0, 6.2832); c.fill();
  }
},

beams(c, t, p, th, W, H) {
  for (let i = 0; i < 7; i++) {
    const o = S.pool[i + 180];
    const x = (o.x * 1.4 - 0.2 + Math.sin(t * 0.12 + o.ph) * 0.05) * W;
    const w = (60 + o.s * 160) * (W / 1920);
    const g = c.createLinearGradient(x, 0, x + w * 0.4, H);
    g.addColorStop(0, rgba(th.accent2, 0.13 * p));
    g.addColorStop(1, rgba(th.accent2, 0));
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x, 0); c.lineTo(x + w, 0); c.lineTo(x + w * 1.6, H); c.lineTo(x + w * 0.6, H);
    c.closePath(); c.fill();
  }
},

shards(c, t, p, th, W, H) {
  for (let i = 0; i < 16; i++) {
    const o = S.pool[i + 60];
    const x = ((o.x + t * 0.01 * o.v) % 1 + 1) % 1 * W;
    const y = ((o.y + t * 0.014) % 1 + 1) % 1 * H;
    const R = (24 + o.s * 60) * (W / 1920);
    const a = t * 0.2 * o.v + o.ph;
    c.save(); c.translate(x, y); c.rotate(a);
    c.globalAlpha = 0.22 * o.z * p;
    c.strokeStyle = th.accent; c.lineWidth = 1.4 * (W / 1920);
    c.beginPath();
    c.moveTo(-R, 0); c.lineTo(0, -R * 0.5); c.lineTo(R, 0); c.lineTo(0, R * 0.5);
    c.closePath(); c.stroke();
    c.restore();
  }
  c.globalAlpha = 1;
},

trail(c, t, p, th, W, H) {
  for (let i = 0; i < 6; i++) {
    const o = S.pool[i + 95];
    const k = ((t * 0.17 * o.v + o.ph) % 1);
    const x = k * W * 1.2 - W * 0.1;
    const y = (0.2 + o.y * 0.6) * H + Math.sin(k * 6.28) * H * 0.06;
    const len = 120 * (W / 1920);
    const g = c.createLinearGradient(x - len, y, x, y);
    g.addColorStop(0, rgba(th.accent, 0));
    g.addColorStop(1, rgba(th.accent, 0.6 * p));
    c.strokeStyle = g; c.lineWidth = 2.4 * (W / 1920);
    c.beginPath(); c.moveTo(x - len, y); c.lineTo(x, y); c.stroke();
    c.fillStyle = rgba(th.fg, 0.9 * p);
    c.beginPath(); c.arc(x, y, 2.6 * (W / 1920) + 1, 0, 6.2832); c.fill();
  }
},

ripplering(c, t, p, th, W, H) {
  const cx = W * 0.5, cy = H * 0.5;
  for (let i = 0; i < 6; i++) {
    const k = ((t * 0.28 + i / 6) % 1);
    const R = k * Math.min(W, H) * 0.9;
    c.globalAlpha = Math.pow(1 - k, 2) * 0.35 * p;
    c.strokeStyle = th.accent2;
    c.lineWidth = (1 + (1 - k) * 3) * (W / 1920);
    c.beginPath(); c.arc(cx, cy, R, 0, 6.2832); c.stroke();
  }
  c.globalAlpha = 1;
},

arcs(c, t, p, th, W, H) {
  const cx = W * 0.5, cy = H * 0.5;
  for (let i = 0; i < 7; i++) {
    const R = Math.min(W, H) * (0.18 + i * 0.055);
    const a0 = t * (0.2 + i * 0.07) + i;
    const span = 0.6 + (i % 3) * 0.5;
    c.globalAlpha = 0.30 * p;
    c.strokeStyle = i % 2 ? th.accent : th.accent2;
    c.lineWidth = 2 * (W / 1920);
    c.beginPath(); c.arc(cx, cy, R, a0, a0 + span); c.stroke();
  }
  c.globalAlpha = 1;
},

compass(c, t, p, th, W, H) {
  const cx = W * 0.5, cy = H * 0.5, R = Math.min(W, H) * 0.36;
  c.globalAlpha = 0.28 * p;
  c.strokeStyle = th.fg; c.lineWidth = 1;
  c.beginPath(); c.arc(cx, cy, R, 0, 6.2832); c.stroke();
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * 6.2832 + t * 0.08;
    const long = i % 9 === 0;
    const r0 = R - (long ? 18 : 8) * (H / 1080);
    c.beginPath();
    c.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    c.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    c.stroke();
  }
  c.globalAlpha = 1;
},

equalizer(c, t, p, th, W, H) {
  const cx = W * 0.5, cy = H * 0.5, R = Math.min(W, H) * 0.30;
  const n = 64;
  c.globalAlpha = 0.5 * p;
  c.strokeStyle = th.accent;
  c.lineWidth = 3 * (W / 1920);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 6.2832;
    const h = (0.2 + 0.8 * Math.abs(Math.sin(t * 2.4 + i * 0.5))) * R * 0.35;
    c.beginPath();
    c.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    c.lineTo(cx + Math.cos(a) * (R + h), cy + Math.sin(a) * (R + h));
    c.stroke();
  }
  c.globalAlpha = 1;
},

nodes(c, t, p, th, W, H) {
  for (let i = 0; i < 9; i++) {
    const o = S.pool[i + 115];
    const x = (0.5 + Math.sin(t * 0.16 + o.ph) * 0.38) * W;
    const y = (0.5 + Math.cos(t * 0.13 + o.ph * 1.3) * 0.32) * H;
    c.globalAlpha = 0.5 * p;
    c.strokeStyle = th.accent;
    c.lineWidth = 1.4 * (W / 1920);
    const R = 16 * (W / 1920) + 6;
    c.beginPath(); c.arc(x, y, R, 0, 6.2832); c.stroke();
    c.fillStyle = rgba(th.accent, 0.8 * p);
    c.beginPath(); c.arc(x, y, R * 0.3, 0, 6.2832); c.fill();
  }
  c.globalAlpha = 1;
},

filmburn(c, t, p, th, W, H) {
  const k = 0.5 + 0.5 * Math.sin(t * 0.7);
  const g = c.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.35,
                                   W * 0.5, H * 0.5, Math.min(W, H) * 0.78);
  g.addColorStop(0, rgba(th.accent, 0));
  g.addColorStop(1, rgba(th.accent, 0.16 * k * p));
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
},

halation(c, t, p, th, W, H) {
  const g = c.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.min(W, H) * 0.6);
  g.addColorStop(0, rgba(th.accent2, 0.10 * p));
  g.addColorStop(0.55, rgba(th.accent2, 0.03 * p));
  g.addColorStop(1, rgba(th.accent2, 0));
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
},

dotgrid(c, t, p, th, W, H) {
  const cell = 34 * (H / 1080);
  c.fillStyle = rgba(th.fg, 0.16 * p);
  for (let y = cell; y < H; y += cell) {
    for (let x = cell; x < W * clamp(p * 1.3); x += cell) {
      c.fillRect(x, y, 1.8, 1.8);
    }
  }
},

ruler(c, t, p, th, W, H) {
  c.globalAlpha = 0.45 * p;
  c.fillStyle = th.fg;
  const n = 60;
  for (let i = 0; i <= n; i++) {
    const long = i % 10 === 0;
    const L = (long ? 20 : 9) * (H / 1080);
    const x = (i / n) * W, y = (i / n) * H;
    c.fillRect(x, 0, 1.4, L);
    c.fillRect(0, y, L, 1.4);
  }
  c.globalAlpha = 1;
},

safearea(c, t, p, th, W, H) {
  c.globalAlpha = 0.22 * p;
  c.strokeStyle = th.fg;
  c.lineWidth = 1;
  // 90% action-safe and 80% title-safe, the broadcast convention.
  [[0.05, 0.05], [0.10, 0.10]].forEach(([mx, my]) => {
    c.strokeRect(W * mx, H * my, W * (1 - mx * 2), H * (1 - my * 2));
  });
  c.globalAlpha = 1;
},

timecode(c, t, p, th, W, H) {
  const f = Math.floor(t * 30);
  const tc = [Math.floor(f / 108000) % 24, Math.floor(f / 1800) % 60,
              Math.floor(f / 30) % 60, f % 30]
    .map(v => String(v).padStart(2, '0')).join(':');
  c.font = `${Math.round(22 * (H / 1080) * 1.3)}px ui-monospace, monospace`;
  c.textBaseline = 'middle';
  c.globalAlpha = 0.55 * p;
  c.fillStyle = th.fg;
  c.fillText(tc, W - 230 * (H / 1080), 56 * (H / 1080));
  c.fillStyle = th.accent;
  c.beginPath();
  c.arc(W - 262 * (H / 1080), 56 * (H / 1080), 6 * (H / 1080),
        0, 6.2832);
  c.globalAlpha = (Math.floor(t * 2) % 2 ? 0.9 : 0.2) * p;
  c.fill();
  c.globalAlpha = 1;
},

caption(c, t, p, th, W, H) {
  const text = S.spec?.project ? String(S.spec.project) : '';
  if (!text) return;
  c.font = `${Math.round(26 * (H / 1080) * 1.2)}px ui-monospace, monospace`;
  const w = c.measureText(text).width + 44 * (H / 1080);
  const x = (W - w) / 2, y = H - 118 * (H / 1080), h = 54 * (H / 1080);
  c.globalAlpha = 0.65 * p;
  c.fillStyle = 'rgba(0,0,0,.6)';
  c.fillRect(x, y, w, h);
  c.globalAlpha = 0.9 * p;
  c.fillStyle = th.fg;
  c.textBaseline = 'middle';
  c.fillText(text, x + 22 * (H / 1080), y + h / 2);
  c.globalAlpha = 1;
},

watermark(c, t, p, th, W, H) {
  const m = 52 * (H / 1080);
  c.globalAlpha = 0.5 * p;
  c.fillStyle = th.accent;
  const s = 22 * (H / 1080);
  c.fillRect(m, H - m - s, s, s);
  c.globalAlpha = 0.6 * p;
  c.fillStyle = th.fg;
  c.font = `${Math.round(19 * (H / 1080) * 1.2)}px ui-monospace, monospace`;
  c.textBaseline = 'middle';
  c.fillText('cased2.0', m + s + 14 * (H / 1080), H - m - s / 2);
  c.globalAlpha = 1;
},

/* ---- transitional ------------------------------------------------------ */
/** Horizontal slice displacement, used on hard cuts, never gratuitously. */
glitch(c, amount, seedN, th, W, H) {
  if (amount <= 0.002) return;
  const r = rng(seedN | 0);
  const slices = 8 + Math.floor(amount * 16);
  for (let i = 0; i < slices; i++) {
    const y = r() * H, h = 4 + r() * 46 * amount;
    const dx = (r() - 0.5) * 190 * amount;
    c.globalAlpha = 0.5 * amount;
    c.fillStyle = r() > 0.5 ? th.accent : th.accent2;
    c.fillRect(dx, y, W, h * 0.26);
  }
  c.globalAlpha = 1;
},
};

/** Every overlay name, for the catalogue and the self-test. */
const FX_NAMES = Object.keys(FX).filter(k => k !== 'glitch');

/** Run the overlays a shot asked for. Unknown names are ignored, not fatal. */
function runFx(list, t, p, th) {
  if (!list) return;
  for (const name of list) {
    const fn = FX[name];
    if (!fn || name === 'glitch') continue;
    try { fn(S.fxCtx, t, p, th, S.W, S.H); }
    catch (e) { /* one bad layer must not cost the frame */ }
    S.fxCtx.globalAlpha = 1;
  }
}

/* =======================================================================
   DOM helpers
   ======================================================================= */

const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/** Scale unit: all layout numbers are authored against a 1080p-tall stage. */
const U = () => S.H / 1080;
const px = v => (v * U()).toFixed(2) + 'px';

/** Split text into clipped lines of words, ready for a staggered rise. */
function splitWords(text, perLine) {
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = [];
  for (const w of words) {
    cur.push(w);
    if (cur.length >= perLine) { lines.push(cur); cur = []; }
  }
  if (cur.length) lines.push(cur);
  const wrap = el('div');
  const nodes = [];
  lines.forEach(ws => {
    const ln = el('span', 'clipline');
    ws.forEach((w, i) => {
      const s = el('span', 'word', esc(w) + (i < ws.length - 1 ? ' ' : ''));
      ln.appendChild(s); nodes.push(s);
    });
    wrap.appendChild(ln);
  });
  return { wrap, nodes };
}

function splitChars(text) {
  const wrap = el('span');
  const nodes = [];
  for (const ch of String(text)) {
    const s = el('span', 'char', ch === ' ' ? '&nbsp;' : esc(ch));
    wrap.appendChild(s); nodes.push(s);
  }
  return { wrap, nodes };
}

/** Staggered rise-and-fade used by nearly every text block. */
function riseIn(nodes, lt, start, step, dur, dy = 1.05) {
  nodes.forEach((n, i) => {
    const p = seg(lt, start + i * step, start + i * step + dur, E.expo);
    n.style.transform = `translateY(${((1 - p) * dy * 100).toFixed(2)}%)`;
    n.style.opacity = p.toFixed(3);
  });
}

/** Tiny tokenizer. Good enough to read as code on screen in one second. */
const KEYWORDS = new Set((
  'def class return import from as if elif else for while in not and or is None True False ' +
  'lambda yield with try except finally raise pass break continue global async await ' +
  'const let var function export default new this typeof instanceof interface type enum ' +
  'public private static void int string bool struct impl fn pub mut use match ' +
  'package func go chan defer select case switch end do then local nil self'
).split(' '));

function highlight(line) {
  let out = '', i = 0;
  const n = line.length;
  while (i < n) {
    const c = line[i];
    // comment to end of line
    if (c === '#' || (c === '/' && line[i + 1] === '/') || (c === '-' && line[i + 1] === '-')) {
      out += `<span class="tok-c">${esc(line.slice(i))}</span>`; break;
    }
    // string literal
    if (c === '"' || c === "'" || c === '`') {
      let j = i + 1;
      while (j < n && line[j] !== c) { if (line[j] === '\\') j++; j++; }
      out += `<span class="tok-s">${esc(line.slice(i, Math.min(j + 1, n)))}</span>`;
      i = j + 1; continue;
    }
    // identifier / keyword / call
    if (/[A-Za-z_$]/.test(c)) {
      let j = i;
      while (j < n && /[\w$]/.test(line[j])) j++;
      const w = line.slice(i, j);
      if (KEYWORDS.has(w)) out += `<span class="tok-k">${esc(w)}</span>`;
      else if (line[j] === '(') out += `<span class="tok-f">${esc(w)}</span>`;
      else out += esc(w);
      i = j; continue;
    }
    // number
    if (/[0-9]/.test(c)) {
      let j = i;
      while (j < n && /[\w.]/.test(line[j])) j++;
      out += `<span class="tok-n">${esc(line.slice(i, j))}</span>`;
      i = j; continue;
    }
    if (/[{}()[\].,;:=+\-*/<>!&|%]/.test(c)) { out += `<span class="tok-p">${esc(c)}</span>`; i++; continue; }
    out += esc(c); i++;
  }
  return out;
}

/* --- title: the hero statement ---------------------------------------- */
BUILD.title = (d) => {
  const n = el('div', 'layer');
  const pad = S.vertical ? 86 : 132;
  const box = el('div');
  box.style.cssText = `position:absolute;left:${px(pad)};right:${px(pad)};` +
    `top:50%;transform:translateY(-50%);`;
  n.appendChild(box);

  const parts = [];
  if (d.kicker) {
    const k = el('div', 'kicker', esc(d.kicker));
    k.style.cssText = `--k:${px(17)};margin-bottom:${px(30)};`;
    box.appendChild(k); parts.push(k);
  }
  // Auto-fit: long headlines step down so a three-word line never runs off
  // the stage, and short ones stay enormous. Authored sizes still win.
  const len = String(d.text || '').length;
  const fit = len <= 22 ? 1.18 : len <= 34 ? 1.0 : len <= 52 ? 0.82
            : len <= 74 ? 0.66 : len <= 100 ? 0.54 : 0.45;
  const size = d.size || Math.round((S.vertical ? 122 : 164) * fit);
  const perLine = d.perLine || (len > 52 ? (S.vertical ? 3 : 4) : (S.vertical ? 2 : 3));
  const t = splitWords(d.text, perLine);
  t.wrap.className = 'display' + (d.caps ? ' caps' : '');
  t.wrap.style.setProperty('--s', px(size));
  box.appendChild(t.wrap);

  let subNodes = [];
  if (d.sub) {
    const s = splitWords(d.sub, 8);
    s.wrap.className = 'sub';
    s.wrap.style.cssText = `--s:${px(29)};margin-top:${px(38)};max-width:${px(900)};`;
    box.appendChild(s.wrap); subNodes = s.nodes;
  }
  if (d.rule !== false) {
    const r = el('div', 'rule');
    r.style.cssText = `height:${px(2)};margin-top:${px(46)};transform-origin:left;`;
    box.appendChild(r); parts.push(r);
  }

  return {
    node: n,
    update(lt) {
      if (d.kicker) {
        const p = seg(lt, 0, .5);
        parts[0].style.opacity = p.toFixed(3);
        parts[0].style.transform = `translateX(${((1 - p) * -22).toFixed(1)}px)`;
      }
      riseIn(t.nodes, lt, 0.14, 0.045, 0.80);
      riseIn(subNodes, lt, 0.62, 0.012, 0.60, 0.6);
      const rule = parts[parts.length - 1];
      if (d.rule !== false && rule.classList.contains('rule'))
        rule.style.transform = `scaleX(${seg(lt, .40, 1.25, E.expo).toFixed(3)})`;
    },
  };
};

  // Count toward the target rather than fading it in: the motion is the point.
  const raw = String(d.value || '0');
  const m = raw.match(/^([\d.]+)(.*)$/);

      val.style.transform = `scale(${lerp(1.14, 1, p).toFixed(4)})`;
      val.style.opacity = clamp(p * 3).toFixed(3);
      const lp = seg(lt, 0.42, 1.0);

  const n = el('div', 'layer');

  term.style.cssText =
    `left:50%;top:50%;width:${(W * 100).toFixed(1)}%;transform:translate(-50%,-50%);`;
  n.appendChild(term);

  const bar = el('div', 'tbar');
  ['#FF5F57', '#FEBC2E', '#28C840'].forEach(c => {
    const u = el('u'); u.style.background = c; bar.appendChild(u);
  });
  bar.appendChild(el('span', '', `&nbsp;&nbsp;${esc(d.path || 'source')}`));
  term.appendChild(bar);

  const pre = el('pre');
  pre.style.setProperty('--cs', px(S.vertical ? 23 : 28));
  term.appendChild(pre);

  const lines = (d.code || []).slice(0, 16);
  const html = lines.map(highlight);
  const total = lines.reduce((a, l) => a + l.length, 0) || 1;

  let caption = null;
  if (d.caption) {
    caption = el('div', 'kicker');
    caption.style.cssText =
      `position:absolute;left:50%;transform:translateX(-50%);` +
      `bottom:${px(S.vertical ? 190 : 110)};--k:${px(16)};`;
    caption.textContent = d.caption;
    n.appendChild(caption);
  }

  return {
    node: n,
    update(lt, p) {
      const tp = seg(lt, 0.22, Math.max(0.9, (d.dur || 3) * 0.78), E.lin);
      let budget = Math.floor(total * tp);
      const out = [];
      for (let i = 0; i < lines.length; i++) {
        if (budget <= 0) break;
        if (budget >= lines[i].length) { out.push(html[i]); budget -= lines[i].length; }
        else { out.push(highlight(lines[i].slice(0, budget)) + '<span class="caret"></span>'); budget = 0; }
      }
      pre.innerHTML = out.join('\n') || '<span class="caret"></span>';
      const ip = seg(lt, 0, 0.62, E.expo);
      term.style.opacity = ip.toFixed(3);
      term.style.transform =
        `translate(-50%,-50%) scale(${lerp(0.955, 1, ip).toFixed(4)}) ` +
        `perspective(${px(2400)}) rotateX(${((1 - ip) * 7).toFixed(2)}deg)`;
      if (caption) caption.style.opacity = seg(lt, 0.75, 1.35).toFixed(3);
    },
  };
};
